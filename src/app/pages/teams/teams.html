<section class="page flex flex-col gap-4">
  <app-page-head
    title="แจ้งเตือน Teams"
    description="ตั้งชื่อช่องและชนิดเหตุ เลือกจำลองร่างข้อความในหน้านี้ หรือส่งเข้า Microsoft Teams จริงผ่าน Incoming Webhook (แสดงเฉพาะเหตุและรหัสใบงาน ไม่ใส่ลำดับคะแนนพนักงาน)"
  >
    @if (teamsInfo(); as info) {
      <span
        actions
        class="e-badge"
        [class.e-badge-success]="info.configured && info.enabled"
        [class.e-badge-secondary]="!info.configured || !info.enabled"
      >
        {{ info.configured && info.enabled ? 'Webhook พร้อมส่ง' : 'ยังไม่ได้เปิด Webhook' }}
      </span>
    }
  </app-page-head>

  <app-section-card
    title="ตั้งค่าเงื่อนไขและช่องทางแจ้งเตือน"
    subtitle="เลือกประเภทเหตุการณ์ที่ต้องการส่งแจ้งเตือนไปยังช่อง Microsoft Teams"
  >
    <div actions class="flex flex-wrap gap-2">
      <button ejs-button [isPrimary]="true" type="button" id="teams-test" (click)="testSend()">
        จำลองร่างข้อความ (ไม่ส่งจริง)
      </button>
      @if (canSend()) {
        <button
          ejs-button
          cssClass="e-success"
          type="button"
          id="teams-send-webhook"
          [disabled]="sending()"
          (click)="sendWebhook()"
        >
          ส่งเข้า Teams จริง (Webhook)
        </button>
      }
    </div>

    <div class="form-grid grid grid-cols-1 md:grid-cols-2 xl:grid-cols-3 items-end">
      <label class="field">
        <span>ช่อง Teams</span>
        <ejs-textbox id="teams-channel" [value]="channel()" (change)="onChannel($event)" width="100%"></ejs-textbox>
      </label>
      <ejs-checkbox
        id="teams-deadline"
        label="สัปดาห์ที่ commit ใกล้หมด"
        [checked]="deadline()"
        (change)="onDeadline($event)"
      ></ejs-checkbox>
      <ejs-checkbox
        id="teams-overrun"
        label="actual มีแนวโน้มเกิน estimate มากกว่า 50%"
        [checked]="overrun()"
        (change)="onOverrun($event)"
      ></ejs-checkbox>
    </div>
    @if (message()) {
      <ejs-message [content]="message()" severity="Success" variant="Outlined"></ejs-message>
    }
    @if (error()) {
      <ejs-message [content]="error()" severity="Error" variant="Outlined"></ejs-message>
    }
  </app-section-card>

  <app-section-card
    title="บันทึกข้อความที่จะส่ง"
    subtitle="ตัวอย่างข้อความแจ้งเตือนที่สร้างจากใบงานเสี่ยงปัจจุบัน"
    [badge]="logRows().length + ' ข้อความ'"
    badgeTone="info"
  >
    @if (logRows().length === 0) {
      <ejs-message
        content="ยังไม่มีการทดสอบ ข้อความจะถูกเก็บในหน้านี้ ไม่ได้ส่งออกไป"
        severity="Info"
        variant="Outlined"
      ></ejs-message>
    } @else {
      <ejs-grid [dataSource]="logRows()" [allowResizing]="true" height="240">
        <e-columns>
          <e-column field="ticketId" headerText="ใบงาน" width="140"></e-column>
          <e-column field="text" headerText="ข้อความ" width="420"></e-column>
          <e-column field="statusLabel" headerText="สถานะ" width="180"></e-column>
        </e-columns>
      </ejs-grid>
    }
  </app-section-card>
</section>
