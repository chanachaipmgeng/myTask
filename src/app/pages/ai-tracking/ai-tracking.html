<section class="page flex flex-col gap-4">
  <app-page-head
    [title]="isMine ? 'ติดตามงาน AI & Spike ของฉัน' : 'ติดตามงาน AI & Spike ทีม'"
    description="เฉพาะใบ Spike, AI, myBOX และ AI Agent. ไม่ใช่คะแนนชุดใหม่. สัดส่วน Spike ใช้สูตร R&amp;D เดิม คือ MD ของใบ Spike ต่อ MD ที่วางไว้."
  ></app-page-head>

  <app-section-card id="ai-spike-ratio" title="สัดส่วน Spike ของ R&amp;D" [attr.data-ratio]="share().ratio">
    <div class="flex flex-col gap-2">
      <div class="flex flex-wrap items-center justify-between gap-2">
        <span>{{ share().percentLabel }} ({{ share().spikeMd }} / {{ share().plannedMd }} MD)</span>
        <span class="e-badge e-badge-info">{{ share().bandLabel }}</span>
      </div>
      <ejs-progressbar
        id="ai-spike-progress"
        type="Linear"
        [theme]="theme.sfTheme()"
        width="100%"
        height="14"
        [minimum]="0"
        [maximum]="100"
        [value]="sharePct()"
        [trackThickness]="10"
        [progressThickness]="10"
        progressColor="#3ec6e0"
        trackColor="#1e4566"
      ></ejs-progressbar>
      <p class="fine m-0 pt-1">MD ในมุมนี้ {{ trackedMd() }} &middot; MD ที่ปิดแล้ว {{ acceptedMd() }}</p>
    </div>
  </app-section-card>

  <div class="grid grid-cols-1 gap-4 xl:grid-cols-12">
    <app-section-card
      class="xl:col-span-5"
      title="กราฟเปรียบเทียบ MD รายใบงาน AI / Spike"
      subtitle="ปริมาณ Man-day ที่ใช้ในงานวิจัยและ AI"
    >
      <div class="chart-frame m-0">
        <ejs-chart
          id="ai-md-chart"
          style="display: block; height: 320px; width: 100%"
          [theme]="theme.sfTheme()"
          [primaryXAxis]="categoryAxis"
          [primaryYAxis]="mdAxis"
          [tooltip]="tooltip"
          [legendSettings]="legend"
          [chartArea]="chartArea"
          [enableAnimation]="true"
        >
          <e-series-collection>
            <e-series
              type="Column"
              [dataSource]="points()"
              xName="id"
              yName="md"
              name="MD"
              columnWidth="0.55"
              fill="#4c68e5"
              [cornerRadius]="columnCorner"
            ></e-series>
          </e-series-collection>
        </ejs-chart>
      </div>
    </app-section-card>

    <app-section-card
      class="xl:col-span-7"
      title="รายการใบงาน AI และ Spike"
      subtitle="ตารางรายละเอียดใบงานพร้อมผลรวม MD ท้ายตาราง"
      [badge]="points().length + ' ใบ'"
      badgeTone="info"
    >
      <ejs-grid
        id="ai-tickets-grid"
        [dataSource]="points()"
        [allowPaging]="true"
        [allowSorting]="true"
        [allowResizing]="true"
        [pageSettings]="{ pageSize: 8 }"
        height="320"
      >
        <e-columns>
          <e-column field="id" headerText="รหัส" width="130"></e-column>
          <e-column field="label" headerText="ผู้รับผิดชอบ" width="160"></e-column>
          <e-column field="module" headerText="โมดูล / หัวข้อ" width="220"></e-column>
          <e-column field="md" headerText="MD" width="110" textAlign="Right" format="N2"></e-column>
        </e-columns>
        <e-aggregates>
          <e-aggregate>
            <e-columns>
              <e-column type="Count" field="id">
                <ng-template #footerTemplate let-data>รวม {{ data.Count }} ใบ</ng-template>
              </e-column>
              <e-column type="Sum" field="md" format="N2">
                <ng-template #footerTemplate let-data>รวม {{ data.Sum }} MD</ng-template>
              </e-column>
            </e-columns>
          </e-aggregate>
        </e-aggregates>
      </ejs-grid>
    </app-section-card>
  </div>
</section>
