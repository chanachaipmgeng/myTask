<section class="page">
  <app-page-head
    breadcrumb="แดชบอร์ดทีม > ตรวจสอบความพร้อมก่อนแช่แข็งคะแนน (/admin/snapshot-check)"
    title="ตรวจสอบความพร้อมก่อนปิดงวดคะแนน"
    description="รันเช็คลิสต์อัตโนมัติ 4 ด่านเพื่อยืนยันความถูกต้องของข้อมูลก่อนทำการบันทึกและแช่แข็งคะแนนประจำงวด"
    [periodBadge]="'งวดที่กำลังปิด: ' + periodKey()"
    [metrics]="[
      { label: 'ความพร้อมรวม', value: readinessScore(), unit: '%', hint: 'ต้อง ≥ 75% และไม่มี Blocker ร้ายแรง', tone: readinessScore() >= 75 ? 'good' : 'bad' }
    ]"
  ></app-page-head>

  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
    @for (item of checks(); track item.stage) {
      <app-kpi-stat
        [title]="item.shortTitle"
        [value]="item.shortValue"
        [hint]="item.fullHint"
        [badge]="item.status"
        [badgeTone]="item.status === 'PASS' ? 'success' : 'warning'"
        [accent]="item.status === 'PASS' ? 'success' : 'warning'"
      ></app-kpi-stat>
    }
  </div>

  <app-section-card
    title="เปรียบเทียบดัชนีรายบุคคลก่อนแช่แข็ง"
    subtitle="เปรียบเทียบดัชนีพัฒนาการงวดก่อนหน้าเทียบกับงวดปัจจุบันที่จะถูกแช่แข็ง"
  >
    <ng-template #nickTpl let-data>
      <app-person-avatar [name]="data.nickname" [showName]="true" size="xs" />
    </ng-template>
    <ng-template #prevTpl let-data>
      <span class="font-mono text-muted">{{ (+data.previousIndex).toFixed(1) }}</span>
    </ng-template>
    <ng-template #currTpl let-data>
      <span class="font-mono font-bold">{{ (+data.currentIndex).toFixed(1) }}</span>
    </ng-template>
    <ng-template #diffTpl let-data>
      <span
        class="font-mono font-bold"
        [class.text-emerald-600]="data.diff >= 0"
        [class.text-rose-600]="data.diff < 0"
      >
        {{ data.diff >= 0 ? '+' + (+data.diff).toFixed(1) : (+data.diff).toFixed(1) }}
      </span>
    </ng-template>
    <ng-template #statusTpl let-data>
      <app-status-badge [label]="data.statusLabel" [value]="data.isTargetMet" />
    </ng-template>

    <app-sf-grid
      [data]="previewDiffs()"
      [columns]="gridColumns"
      [cellTemplates]="{
        nickname: nickTpl,
        previousIndex: prevTpl,
        currentIndex: currTpl,
        diff: diffTpl,
        statusLabel: statusTpl
      }"
      [options]="gridOptions"
    />

    <div class="mt-2 pt-4 border-t border-[color:var(--line)] flex flex-wrap justify-between items-center gap-4">
      <app-sf-checkbox
        label="ยืนยันว่าได้ตรวจสอบข้อมูลและความถูกต้องครบถ้วนแล้ว"
        [checked]="isConfirmed()"
        (checkedChange)="isConfirmed.set($event)"
      />

      <div class="flex gap-3">
        <button ejs-button cssClass="e-flat" (click)="cancel()">ยกเลิก</button>
        <button
          ejs-button
          cssClass="e-primary"
          iconCss="e-icons e-lock"
          [disabled]="!isConfirmed() || isFreezing()"
          (click)="freezeSnapshot()"
        >
          {{ isFreezing() ? 'กำลังแช่แข็ง...' : 'ยืนยันการแช่แข็งคะแนน (Freeze Snapshot)' }}
        </button>
      </div>
    </div>
  </app-section-card>
</section>
