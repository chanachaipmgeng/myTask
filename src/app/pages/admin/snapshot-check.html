<section class="page">
  <app-page-head
    breadcrumb="แดชบอร์ดทีม > ตรวจสอบความพร้อมก่อนแช่แข็งคะแนน (/admin/snapshot-check)"
    title="ห้องตรวจสอบความพร้อมก่อนปิดงวดคะแนน (Pre-Snapshot Freeze Gate)"
    description="รันเช็คลิสต์อัตโนมัติ 4 ด่านเพื่อยืนยันความถูกต้องของข้อมูลก่อนทำการบันทึกและแช่แข็งคะแนนประจำงวด"
    [periodBadge]="'งวดที่กำลังปิด: ' + periodKey()"
  ></app-page-head>

  <app-section-card
    title="คะแนนความพร้อมรวม (Overall Readiness Score)"
    subtitle="ต้องผ่านเกณฑ์อย่างน้อย 75% และไม่มี Blocker ที่ร้ายแรง"
  >
    <div actions class="text-right">
      <p class="kpi-value m-0">{{ readinessScore() }}%</p>
      <app-status-badge
        [label]="readinessScore() >= 75 ? 'ผ่านเกณฑ์พร้อมแช่แข็ง' : 'ยังไม่พร้อม'"
        [tone]="readinessScore() >= 75 ? 'success' : 'warning'"
      ></app-status-badge>
    </div>
    <ejs-progressbar
      [value]="readinessScore()"
      [theme]="theme.sfTheme()"
      height="12"
      progressColor="#10b981"
      [trackColor]="theme.progressTrack()"
    ></ejs-progressbar>
  </app-section-card>

  <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
    @for (item of checks(); track item.stage) {
      <app-kpi-stat
        [title]="'ด่านที่ ' + item.stage + ': ' + item.name"
        [value]="item.summary"
        [hint]="item.detail"
        [badge]="item.status"
        [badgeTone]="item.status === 'PASS' ? 'success' : 'warning'"
        [accent]="item.status === 'PASS' ? 'success' : 'warning'"
      ></app-kpi-stat>
    }
  </div>

  <app-section-card
    title="ตารางเปรียบเทียบคะแนนดัชนีรายบุคคล (Snapshot Preview Diff Table)"
    subtitle="เปรียบเทียบดัชนีพัฒนาการงวดก่อนหน้าเทียบกับงวดปัจจุบันที่จะถูกแช่แข็ง"
  >
    <ejs-grid [dataSource]="previewDiffs()" [allowSorting]="true">
      <e-columns>
        <e-column field="nickname" headerText="พนักงาน" width="150">
          <ng-template #template let-data>
            <span class="font-semibold">{{ data.nickname }}</span>
          </ng-template>
        </e-column>
        <e-column field="trackLabel" headerText="สายงาน" width="150"></e-column>
        <e-column field="previousIndex" headerText="ดัชนีงวดก่อน" width="130" textAlign="Right">
          <ng-template #template let-data>
            <span class="font-mono text-muted">{{ (+data.previousIndex).toFixed(1) }}</span>
          </ng-template>
        </e-column>
        <e-column field="currentIndex" headerText="ดัชนีงวดนี้ (สด)" width="150" textAlign="Right">
          <ng-template #template let-data>
            <span class="font-mono font-bold">{{ (+data.currentIndex).toFixed(1) }}</span>
          </ng-template>
        </e-column>
        <e-column field="diff" headerText="ส่วนต่าง (Diff)" width="130" textAlign="Right">
          <ng-template #template let-data>
            <span
              class="font-mono font-bold"
              [class.text-emerald-600]="data.diff >= 0"
              [class.text-rose-600]="data.diff < 0"
            >
              {{ data.diff >= 0 ? '+' + (+data.diff).toFixed(1) : (+data.diff).toFixed(1) }}
            </span>
          </ng-template>
        </e-column>
        <e-column field="statusLabel" headerText="สถานะเทียบเป้า" width="140" textAlign="Center">
          <ng-template #template let-data>
            <app-status-badge
              [label]="data.statusLabel"
              [value]="data.isTargetMet"
            ></app-status-badge>
          </ng-template>
        </e-column>
      </e-columns>
    </ejs-grid>

    <div class="mt-2 pt-4 border-t border-[color:var(--line)] flex flex-wrap justify-between items-center gap-4">
      <ejs-checkbox
        label="ยืนยันว่าได้ตรวจสอบข้อมูลและความถูกต้องครบถ้วนแล้ว"
        [checked]="isConfirmed()"
        (change)="onConfirmChange($event)"
      ></ejs-checkbox>

      <div class="flex gap-3">
        <button ejs-button cssClass="e-flat" (click)="cancel()">ยกเลิก</button>
        <button
          ejs-button
          cssClass="e-primary"
          iconCss="e-icons e-lock"
          [disabled]="!isConfirmed() || isFreezing()"
          (click)="freezeSnapshot()"
        >
          {{ isFreezing() ? 'กำลังแช่แข็ง...' : 'ยืนยันการแช่แข็งคะแนน (Freeze Snapshot)' }}
        </button>
      </div>
    </div>
  </app-section-card>
</section>
