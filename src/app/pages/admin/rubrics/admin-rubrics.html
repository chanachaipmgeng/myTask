<section class="page">
  <app-page-head
    breadcrumb="Admin Hub > ทะเบียนเกณฑ์มาตรฐาน"
    title="ทะเบียนเกณฑ์มาตรฐาน (Rubric Registry)"
    description="ปรับแต่งเกณฑ์ประเมินขนาดงาน (Sizing), น้ำหนักคะแนนใบงาน (Ticket Score), และสูตรดัชนีชี้วัด (Person Index) แบบไดนามิกโดยไม่ต้องแก้ไขโค้ด"
    periodBadge="v2026.4"
  >
    <div actions class="flex flex-wrap items-center gap-2">
      <a routerLink="/admin" ejs-button cssClass="e-outline e-small" iconCss="e-icons e-home">
        สิทธิ์ &amp; โควตา
      </a>
      <a routerLink="/integrations" ejs-button cssClass="e-outline e-small" iconCss="e-icons e-link">
        Integrations
      </a>
      <button ejs-button cssClass="e-primary e-small" iconCss="e-icons e-refresh" (click)="loadRubrics()">
        รีเฟรชข้อมูล
      </button>
    </div>
  </app-page-head>

  <app-flash-messages [success]="saveNotice()"></app-flash-messages>

  <div class="kpi-grid-4">
    <app-kpi-stat
      title="เกณฑ์ทั้งหมดในระบบ"
      value="7 เกณฑ์"
      badge="Active ทั้งหมด"
      badgeTone="info"
      accent="info"
      hint="Rubric Registry"
    ></app-kpi-stat>
    <app-kpi-stat
      title="กรอบขนาดงาน (Sizing)"
      value="5 ระดับ"
      badge="Tiered"
      badgeTone="success"
      accent="success"
      hint="XS, S, M, L, XL"
    ></app-kpi-stat>
    <app-kpi-stat
      title="คะแนนใบงานเต็ม"
      value="100 คะแนน"
      badge="4 แกน"
      badgeTone="warning"
      accent="warning"
      hint="OnTime, Acc, Rev, Reopen"
    ></app-kpi-stat>
    <app-kpi-stat
      title="เป้าหมายดัชนี R&D"
      value="≥ 75.0"
      badge="Index Target"
      badgeTone="primary"
      accent="info"
      hint="DoD 40%, Spike 25%, Quota 20%"
    ></app-kpi-stat>
  </div>

  <app-section-card
    title="ตารางพารามิเตอร์เกณฑ์มาตรฐาน"
    subtitle="ดับเบิลคลิกที่แถวเพื่อแก้ไขแบบ Inline — รองรับปุ่ม Edit, Update, Cancel บน Toolbar"
  >
    <div class="overflow-x-auto w-full">
      <ejs-grid
        #rubricGrid
        [dataSource]="rubrics()"
        [editSettings]="editSettings"
        [toolbar]="toolbar"
        [allowSorting]="true"
        [allowResizing]="true"
        (actionComplete)="onActionComplete($event)"
        gridLines="Both"
        width="100%"
      >
        <e-columns>
          <e-column
            field="rubric_id"
            headerText="รหัส Rubric"
            width="115"
            [isPrimaryKey]="true"
            textAlign="Left"
          ></e-column>
          <e-column
            field="category"
            headerText="หมวดหมู่"
            width="100"
            [allowEditing]="false"
            textAlign="Center"
          ></e-column>
          <e-column
            field="title"
            headerText="ชื่อเกณฑ์"
            width="160"
            textAlign="Left"
          ></e-column>
          <e-column
            field="paramsSummary"
            headerText="สรุปพารามิเตอร์คำนวณ"
            width="200"
            [allowEditing]="false"
            textAlign="Left"
          ></e-column>
          <e-column
            field="paramsJson"
            headerText="พารามิเตอร์ JSON (แก้ไขได้)"
            width="200"
            textAlign="Left"
          ></e-column>
          <e-column
            field="is_active"
            headerText="เปิดใช้งาน"
            width="85"
            displayAsCheckBox="true"
            type="boolean"
            textAlign="Center"
          ></e-column>
          <e-column
            field="version"
            headerText="เวอร์ชัน"
            width="75"
            [allowEditing]="false"
            textAlign="Center"
          ></e-column>
        </e-columns>
      </ejs-grid>
    </div>
  </app-section-card>
</section>
