<section class="page">
  <app-page-head
    breadcrumb="Admin Hub > ทะเบียนเกณฑ์มาตรฐาน"
    title="ทะเบียนเกณฑ์มาตรฐาน (Rubric Registry)"
    description="ปรับแต่งเกณฑ์ประเมินขนาดงาน (Sizing), น้ำหนักคะแนนใบงาน (Ticket Score), และสูตรดัชนีชี้วัด (Person Index) แบบไดนามิกโดยไม่ต้องแก้ไขโค้ด"
    periodBadge="v2026.4"
    [metrics]="[
      { label: 'เกณฑ์ทั้งหมด', value: '7', unit: 'เกณฑ์', hint: 'Active ทั้งหมด' },
      { label: 'กรอบขนาดงาน', value: '5', unit: 'ระดับ', hint: 'XS, S, M, L, XL' },
      { label: 'คะแนนใบงานเต็ม', value: '100', unit: 'คะแนน', hint: 'On-time, Accuracy, Review, Reopen' },
      { label: 'เป้าดัชนี R&D', value: '≥ 75.0', hint: 'DoD 40% · Spike 25% · Quota 20%' }
    ]"
  >
    <div actions class="flex flex-wrap items-center gap-2">
      <a routerLink="/admin" ejs-button cssClass="e-outline e-small" iconCss="e-icons e-home">
        สิทธิ์ &amp; โควตา
      </a>
      <a routerLink="/integrations" ejs-button cssClass="e-outline e-small" iconCss="e-icons e-link">
        Integrations
      </a>
      <button ejs-button cssClass="e-primary e-small" iconCss="e-icons e-refresh" (click)="loadRubrics()">
        รีเฟรชข้อมูล
      </button>
    </div>
  </app-page-head>

  <app-flash-messages [success]="saveNotice()"></app-flash-messages>

  <app-section-card
    title="ตารางพารามิเตอร์เกณฑ์มาตรฐาน"
    subtitle="ดับเบิลคลิกที่แถวเพื่อแก้ไขแบบ Inline — รองรับปุ่ม Edit, Update, Cancel บน Toolbar"
  >
    <div class="overflow-x-auto w-full">
      <ejs-grid
        #rubricGrid
        [dataSource]="rubrics()"
        [editSettings]="editSettings"
        [toolbar]="toolbar"
        [allowSorting]="true"
        [allowResizing]="true"
        [allowTextWrap]="true"
        (actionComplete)="onActionComplete($event)"
        gridLines="Both"
        width="100%"
      >
        <e-columns>
          <e-column
            field="rubric_id"
            headerText="รหัส Rubric"
            width="115"
            [isPrimaryKey]="true"
            textAlign="Left"
          ></e-column>
          <e-column
            field="category"
            headerText="หมวดหมู่"
            width="100"
            [allowEditing]="false"
            textAlign="Center"
          ></e-column>
          <e-column
            field="title"
            headerText="ชื่อเกณฑ์"
            width="160"
            textAlign="Left"
          ></e-column>
          <e-column
            field="paramsSummary"
            headerText="สรุปพารามิเตอร์คำนวณ"
            width="200"
            [allowEditing]="false"
            textAlign="Left"
          ></e-column>
          <e-column
            field="paramsJson"
            headerText="พารามิเตอร์ JSON (แก้ไขได้)"
            width="200"
            textAlign="Left"
          ></e-column>
          <e-column
            field="is_active"
            headerText="เปิดใช้งาน"
            width="85"
            displayAsCheckBox="true"
            type="boolean"
            textAlign="Center"
          ></e-column>
          <e-column
            field="version"
            headerText="เวอร์ชัน"
            width="75"
            [allowEditing]="false"
            textAlign="Center"
          ></e-column>
        </e-columns>
      </ejs-grid>
    </div>
  </app-section-card>
</section>
