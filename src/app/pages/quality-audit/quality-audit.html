<section class="page">
  <app-page-head
    breadcrumb="ภาพรวมและวิเคราะห์ > ตรวจสอบคุณภาพ QA &amp; Defect Audit (/quality/audit)"
    title="ตรวจสอบคุณภาพ QA และ Defect Leakage"
    description="ตรวจสอบ First-Time Right %, อัตราการตีกลับ (Reopen Rate), อัตราหลุดไป Production และหลักฐาน DoD ก่อนส่งทดสอบ"
    periodBadge="งวดปัจจุบัน: 2026-11"
  ></app-page-head>

  <!-- Bento KPI Metrics Row -->
  <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-4">
    <app-kpi-stat
      title="First-Time Right %"
      [value]="kpis().firstTimeRightPct + '%'"
      hint="เป้าหมายมาตรฐาน ≥ 85%"
      [badge]="kpis().firstTimeRightPct >= 85 ? 'ผ่านเกณฑ์' : 'ต่ำกว่าเป้า'"
      [badgeTone]="kpis().firstTimeRightPct >= 85 ? 'success' : 'danger'"
      iconCss="e-icons e-circle-check"
      [progress]="kpis().firstTimeRightPct"
      [accent]="kpis().firstTimeRightPct >= 85 ? 'success' : 'danger'"
      layout="icon-start"
    ></app-kpi-stat>

    <app-kpi-stat
      title="Reopen Rate %"
      [value]="kpis().reopenRatePct + '%'"
      [hint]="'ตีกลับ ' + kpis().reopenCount + ' จาก ' + kpis().totalClosed + ' ใบ'"
      [badge]="kpis().reopenRatePct <= 15 ? 'ปกติ' : 'ตีกลับสูง'"
      [badgeTone]="kpis().reopenRatePct <= 15 ? 'info' : 'warning'"
      iconCss="e-icons e-repeat"
      [progress]="kpis().reopenRatePct"
      [accent]="kpis().reopenRatePct <= 15 ? 'info' : 'warning'"
      layout="icon-start"
    ></app-kpi-stat>

    <app-kpi-stat
      title="Bug Escape Rate %"
      [value]="kpis().bugEscapePct + '%'"
      [hint]="'หลุด Prod ' + kpis().bugEscapeCount + ' ใบ (เกณฑ์ ≤ 5%)'"
      [badge]="kpis().bugEscapePct <= 5 ? 'ดีเยี่ยม' : 'หลุดเป้า'"
      [badgeTone]="kpis().bugEscapePct <= 5 ? 'success' : 'danger'"
      iconCss="e-icons e-bug"
      [progress]="kpis().bugEscapePct"
      [accent]="kpis().bugEscapePct <= 5 ? 'teal' : 'danger'"
      layout="icon-start"
    ></app-kpi-stat>

    <app-kpi-stat
      title="DoD Evidence %"
      [value]="kpis().dodEvidencePct + '%'"
      [hint]="'ขาดหลักฐาน ' + kpis().dodMissingCount + ' ใบ'"
      [badge]="kpis().dodMissingCount === 0 ? 'หลักฐานครบ' : 'ต้องตามหลักฐาน'"
      [badgeTone]="kpis().dodMissingCount === 0 ? 'success' : 'warning'"
      iconCss="e-icons e-shield"
      [progress]="kpis().dodEvidencePct"
      [accent]="kpis().dodMissingCount === 0 ? 'violet' : 'coral'"
      layout="icon-start"
    ></app-kpi-stat>
  </div>

  <app-section-card [showHead]="false">
    <ng-template #dodTabTpl>
      <div class="pt-4 flex flex-col gap-4">
        <app-sf-message
          severity="Warning"
          content="DoD Gate Verifier: ตรวจอัตโนมัติว่ามีลิงก์ MR, Unit Test ผ่าน และผล Staging Verified ครบหรือไม่ — หากไม่ครบ QA สามารถกดตีกลับ Dev ได้ทันที"
        />

        <ng-template #dodTicketTpl let-data>
          <button ejs-button cssClass="e-link e-small font-semibold" type="button" (click)="openTicket(data.ticketId)">
            {{ data.ticketId }}
          </button>
        </ng-template>
        <ng-template #dodMrTpl let-data>
          <span class="font-mono text-xs text-blue-600 dark:text-blue-400 underline">{{ data.mrLink }}</span>
        </ng-template>
        <ng-template #dodUnitTpl let-data>
          <app-status-badge [label]="data.unitTestLabel" [value]="data.unitTestPassed"></app-status-badge>
        </ng-template>
        <ng-template #dodCiTpl let-data>
          <app-status-badge
            [label]="data.ciStatusLabel"
            [tone]="data.ciPassed === true ? 'success' : data.ciPassed === false ? 'warning' : 'secondary'"
          ></app-status-badge>
        </ng-template>
        <ng-template #dodStagingTpl let-data>
          <app-status-badge
            [label]="data.stagingVerified ? 'แนบรูปแล้ว' : 'ยังไม่แนบ'"
            [tone]="data.stagingVerified ? 'success' : 'warning'"
          ></app-status-badge>
        </ng-template>
        <ng-template #dodStatusTpl let-data>
          <app-status-badge
            [label]="data.dodStatus"
            [tone]="data.isComplete ? 'success' : 'warning'"
          ></app-status-badge>
        </ng-template>
        <ng-template #dodActionTpl let-data>
          @if (!data.isComplete && (role() === 'admin' || role() === 'lead')) {
            <button
              ejs-button
              cssClass="e-small e-outline e-danger"
              (click)="rejectToDev(data.ticketId, data.devName)"
            >
              ตีกลับ Dev
            </button>
          } @else {
            <span class="text-xs text-muted">พร้อมตรวจ</span>
          }
        </ng-template>

        <app-sf-grid
          [data]="dodChecklist()"
          [columns]="dodColumns"
          [options]="dodGridOptions"
          [cellTemplates]="{
            ticketId: dodTicketTpl,
            mrLink: dodMrTpl,
            unitTestLabel: dodUnitTpl,
            ciStatusLabel: dodCiTpl,
            stagingVerified: dodStagingTpl,
            dodStatus: dodStatusTpl,
            action: dodActionTpl
          }"
        />
      </div>
    </ng-template>

    <ng-template #reopenTabTpl>
      <div class="pt-4 flex flex-col gap-5">
        <!-- Pareto 80/20 Root-Cause Analysis Chart -->
        <app-section-card
          variant="nested"
          title="แผนภูมิพาเรโตวิเคราะห์สาเหตุการตีกลับ"
          subtitle="เรียงลำดับความถี่สาเหตุจากมากไปน้อย (แกนซ้าย: แท่ง) ควบคู่กับเปอร์เซ็นต์สะสม (แกนขวา: เส้น) พร้อมเส้นเตือนเกณฑ์วิกฤต 80%"
          [badge]="'รวม ' + paretoReport().total + ' ครั้ง'"
          badgeTone="warning"
        >
          <app-sf-chart
            [series]="paretoSeries()"
            [primaryXAxis]="paretoXAxis"
            [primaryYAxis]="paretoCountAxis"
            [options]="paretoChartOptions"
          />

          <app-sf-message severity="Info" [content]="paretoReport().insight" />
        </app-section-card>

        <ng-template #reopenTicketTpl let-data>
          <button ejs-button cssClass="e-link e-small font-semibold" type="button" (click)="openTicket(data.ticketId)">
            {{ data.ticketId }}
          </button>
        </ng-template>
        <ng-template #reopenCountTpl let-data>
          <span class="font-bold text-rose-600">{{ data.reopenCount }} ครั้ง</span>
        </ng-template>
        <ng-template #bugCauseTpl let-data>
          <app-status-badge [label]="data.bugCause" tone="secondary"></app-status-badge>
        </ng-template>
        <ng-template #escapeTpl let-data>
          <app-status-badge
            [label]="data.isBugEscape ? 'หลุด Prod' : 'ตรวจพบใน QA'"
            [tone]="data.isBugEscape ? 'danger' : 'info'"
          ></app-status-badge>
        </ng-template>

        <app-sf-grid
          [data]="reopenEscapes()"
          [columns]="reopenColumns"
          [options]="reopenGridOptions"
          [cellTemplates]="{
            ticketId: reopenTicketTpl,
            reopenCount: reopenCountTpl,
            bugCause: bugCauseTpl,
            isBugEscape: escapeTpl
          }"
        />
      </div>
    </ng-template>

    <app-sf-tabs
      id="qualityTab"
      [tabs]="qualityTabs()"
      [tabTemplates]="{ dod: dodTabTpl, reopen: reopenTabTpl }"
    />
  </app-section-card>
</section>
