<section class="page">
  <app-page-head
    breadcrumb="ภาพรวมและวิเคราะห์ > ตรวจสอบคุณภาพ QA &amp; Defect Audit (/quality/audit)"
    title="ศูนย์ตรวจสอบคุณภาพ QA และช่องโหว่บั๊ก (QA &amp; Defect Leakage Audit)"
    description="ตรวจสอบ First-Time Right %, อัตราการตีกลับ (Reopen Rate), อัตราหลุดไป Production และหลักฐาน DoD ก่อนส่งทดสอบ"
    periodBadge="งวดปัจจุบัน: 2026-11"
  ></app-page-head>

  <div class="kpi-grid-4">
    <app-kpi-stat
      title="FIRST-TIME RIGHT %"
      [value]="kpis().firstTimeRightPct + '%'"
      iconCss="e-check-box"
      layout="icon-start"
      accent="success"
      hint="เป้าหมาย ≥ 85.0% (ผ่านเกณฑ์)"
      [progress]="kpis().firstTimeRightPct"
      [trendValue]="kpis().firstTimeRightPct >= 85 ? '+ผ่านเป้า' : 'ต่ำกว่าเป้า'"
      [trendDirection]="kpis().firstTimeRightPct >= 85 ? 'up' : 'down'"
      progressColor="#22c55e"
    ></app-kpi-stat>
    <app-kpi-stat
      title="REOPEN RATE (QA ตีกลับ)"
      [value]="kpis().reopenRatePct + '%'"
      iconCss="e-repeat"
      layout="icon-start"
      accent="warning"
      [hint]="'ตีกลับ ' + kpis().reopenCount + ' จาก ' + kpis().totalClosed + ' ใบ'"
    ></app-kpi-stat>
    <app-kpi-stat
      title="BUG ESCAPE (หลุด PROD)"
      [value]="kpis().bugEscapePct + '%'"
      iconCss="e-warning"
      layout="icon-start"
      accent="danger"
      [hint]="'ตรวจพบ ' + kpis().bugEscapeCount + ' ใบ (เกณฑ์ ≤ 5.0%)'"
    ></app-kpi-stat>
    <app-kpi-stat
      title="DOD EVIDENCE ครบถ้วน"
      [value]="kpis().dodEvidencePct + '%'"
      iconCss="e-file-protect"
      layout="icon-start"
      accent="info"
      [hint]="'ขาดหลักฐาน ' + kpis().dodMissingCount + ' ใบ'"
      [progress]="kpis().dodEvidencePct"
      progressColor="#3b82f6"
    ></app-kpi-stat>
  </div>

  <app-section-card [showHead]="false">
    <ejs-tab id="qualityTab" animation="none">
      <e-tabitems>
        <e-tabitem [header]="{ text: 'ตรวจสอบหลักฐาน DoD ก่อนเข้า QA (' + dodChecklist().length + ')' }">
          <ng-template #content>
            <div class="pt-4 flex flex-col gap-4">
              <ejs-message
                severity="Warning"
                variant="Outlined"
                content="DoD Gate Verifier: ตรวจอัตโนมัติว่ามีลิงก์ MR, Unit Test ผ่าน และผล Staging Verified ครบหรือไม่ — หากไม่ครบ QA สามารถกดตีกลับ Dev ได้ทันที"
              ></ejs-message>

              <ejs-grid [dataSource]="dodChecklist()" [allowSorting]="true">
                <e-columns>
                  <e-column field="ticketId" headerText="รหัสใบงาน" width="120" textAlign="Left">
                    <ng-template #template let-data>
                      <span class="font-semibold text-blue-600 dark:text-blue-400">{{ data.ticketId }}</span>
                    </ng-template>
                  </e-column>
                  <e-column field="devName" headerText="ผู้พัฒนา (Dev)" width="150"></e-column>
                  <e-column field="qaName" headerText="ผู้ตรวจ QA" width="150"></e-column>
                  <e-column field="mrLink" headerText="ลิงก์ MR" width="130">
                    <ng-template #template let-data>
                      <span class="font-mono text-xs text-blue-600 dark:text-blue-400 underline">{{ data.mrLink }}</span>
                    </ng-template>
                  </e-column>
                  <e-column field="unitTestLabel" headerText="Unit Test" width="130">
                    <ng-template #template let-data>
                      <app-status-badge
                        [label]="data.unitTestLabel"
                        [value]="data.unitTestPassed"
                      ></app-status-badge>
                    </ng-template>
                  </e-column>
                  <e-column field="stagingVerified" headerText="ผล Staging" width="130">
                    <ng-template #template let-data>
                      <app-status-badge
                        [label]="data.stagingVerified ? 'แนบรูปแล้ว' : 'ยังไม่แนบ'"
                        [tone]="data.stagingVerified ? 'success' : 'warning'"
                      ></app-status-badge>
                    </ng-template>
                  </e-column>
                  <e-column field="dodStatus" headerText="สถานะหลักฐาน DoD" width="160">
                    <ng-template #template let-data>
                      <app-status-badge
                        [label]="data.dodStatus"
                        [tone]="data.isComplete ? 'success' : 'warning'"
                      ></app-status-badge>
                    </ng-template>
                  </e-column>
                  <e-column headerText="การจัดการ" width="140" textAlign="Center">
                    <ng-template #template let-data>
                      @if (!data.isComplete && (role() === 'admin' || role() === 'lead')) {
                        <button
                          ejs-button
                          cssClass="e-small e-outline e-danger"
                          (click)="rejectToDev(data.ticketId, data.devName)"
                        >
                          ตีกลับ Dev
                        </button>
                      } @else {
                        <span class="text-xs text-muted">พร้อมตรวจ</span>
                      }
                    </ng-template>
                  </e-column>
                </e-columns>
              </ejs-grid>
            </div>
          </ng-template>
        </e-tabitem>

        <e-tabitem [header]="{ text: 'วิเคราะห์สาเหตุ Reopen & Bug Escape (' + reopenEscapes().length + ')' }">
          <ng-template #content>
            <div class="pt-4 flex flex-col gap-4">
              <ejs-grid [dataSource]="reopenEscapes()" [allowSorting]="true" [allowFiltering]="true">
                <e-columns>
                  <e-column field="ticketId" headerText="รหัสใบงาน" width="130"></e-column>
                  <e-column field="title" headerText="ชื่องาน" width="220"></e-column>
                  <e-column field="assignee" headerText="ผู้รับผิดชอบ" width="150"></e-column>
                  <e-column field="reopenCount" headerText="จำนวน Reopen" width="130" textAlign="Right">
                    <ng-template #template let-data>
                      <span class="font-bold text-rose-600">{{ data.reopenCount }} ครั้ง</span>
                    </ng-template>
                  </e-column>
                  <e-column field="bugCause" headerText="สาเหตุของบั๊ก" width="160">
                    <ng-template #template let-data>
                      <app-status-badge [label]="data.bugCause" tone="secondary"></app-status-badge>
                    </ng-template>
                  </e-column>
                  <e-column field="isBugEscape" headerText="หลุด Prod หรือไม่" width="140" textAlign="Center">
                    <ng-template #template let-data>
                      <app-status-badge
                        [label]="data.isBugEscape ? 'หลุด Prod' : 'ตรวจพบใน QA'"
                        [tone]="data.isBugEscape ? 'danger' : 'info'"
                      ></app-status-badge>
                    </ng-template>
                  </e-column>
                  <e-column field="notes" headerText="บันทึกเพิ่มเติม" width="220"></e-column>
                </e-columns>
              </ejs-grid>
            </div>
          </ng-template>
        </e-tabitem>
      </e-tabitems>
    </ejs-tab>
  </app-section-card>
</section>
