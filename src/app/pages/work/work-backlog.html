<app-section-card
  [title]="isMine() ? 'แบ็กล็อกของฉัน' : 'รายการงานรอจัดสรร (Backlog)'"
  [subtitle]="
    isMine()
      ? 'ใบที่รับผิดชอบแล้วยังอยู่ในสถานะ Backlog · เปิดบอร์ดเพื่อเริ่มงาน'
      : 'ใบใน Backlog หรือยังไม่มีผู้รับ · สำหรับจัดคิวเต็มรูปแบบไปที่คิวงานใหม่'
  "
  [badge]="rows().length + ' ใบ'"
  badgeTone="info"
>
  @if (isMine()) {
    <a actions ejs-button cssClass="e-outline e-small" [routerLink]="boardLink()">เปิดบอร์ดของฉัน</a>
  } @else {
    <a actions ejs-button cssClass="e-outline e-small" routerLink="/work/queue">เปิดคิวงานใหม่</a>
  }

  @if (rows().length === 0) {
    <p class="fine">{{ isMine() ? 'ยังไม่มีใบ Backlog ที่มอบหมายให้คุณ' : 'ไม่มีใบใน Backlog ตามตัวกรองปัจจุบัน' }}</p>
  } @else {
    <ng-template #idTpl let-data>
      <button ejs-button cssClass="e-link e-small font-semibold" type="button" (click)="openTicket(data.id)">
        {{ data.id }}
      </button>
    </ng-template>
    <app-sf-grid
      [data]="rows()"
      [columns]="columns()"
      [cellTemplates]="{ id: idTpl }"
      [aggregates]="aggregates"
      [options]="gridOptions()"
    />
  }
</app-section-card>
