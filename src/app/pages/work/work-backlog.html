<app-section-card
  [title]="isMine() ? 'งานรอจัดของฉัน' : 'งานรอจัด'"
  [subtitle]="
    isMine()
      ? 'ใบที่รับผิดชอบแล้วยังรอเริ่มงาน · เปิดบอร์ดเพื่อเริ่มได้'
      : 'ใบที่ยังรอจัดผู้รับ · จัดคิวเต็มรูปแบบได้ที่คิวจ่ายงาน'
  "
  [badge]="rows().length + ' ใบ'"
  badgeTone="info"
>
  @if (isMine()) {
    <a actions ejs-button cssClass="e-outline e-small" [routerLink]="boardLink()">เปิดบอร์ดของฉัน</a>
  } @else {
    <a actions ejs-button cssClass="e-outline e-small" routerLink="/work/queue">เปิดคิวงานใหม่</a>
  }

  @if (rows().length === 0) {
    <p class="fine">{{ isMine() ? 'ยังไม่มีงานรอจัดที่มอบหมายให้คุณ' : 'ไม่มีงานรอจัดตามตัวกรองปัจจุบัน' }}</p>
  } @else {
    <ng-template #idTpl let-data>
      <button ejs-button cssClass="e-link e-small font-semibold" type="button" (click)="openTicket(data.id)">
        {{ data.id }}
      </button>
    </ng-template>
    <app-sf-grid
      [data]="rows()"
      [columns]="columns()"
      [cellTemplates]="{ id: idTpl }"
      [aggregates]="aggregates"
      [options]="gridOptions()"
    />
  }
</app-section-card>
