<div class="section-card">
  <div class="section-card-head">
    <div class="section-card-copy">
      <h3>รายการใบงานปฏิบัติการ (Work List)</h3>
      <p class="fine">รายการใบงานแนวปฏิบัติงาน (ไม่ใช่ตารางคะแนน) &middot; คลิกแถวหรือปุ่มดูสรุป</p>
    </div>
    <span class="e-badge e-badge-info e-badge-pill">{{ rows().length }} ใบ</span>
  </div>
  <ejs-grid
    #listGrid
    id="work-operational-list-grid-v2"
    [dataSource]="rows()"
    [enablePersistence]="true"
    [allowPaging]="true"
    [allowSorting]="true"
    [allowFiltering]="true"
    [allowResizing]="true"
    [showColumnChooser]="true"
    [allowExcelExport]="true"
    [toolbar]="toolbar"
    [pageSettings]="pageSettings"
    (toolbarClick)="onToolbarClick($event)"
    (rowSelected)="onRowSelected($event)"
  >
    <e-columns>
      <e-column field="workLabel" headerText="Work" width="300"></e-column>
      <e-column field="type" headerText="Type" width="110"></e-column>
      <e-column field="assignee" headerText="Assignee" width="130"></e-column>
      <e-column field="status" headerText="Status" width="130">
        <ng-template #template let-data>
          <app-status-badge [value]="data.status" [toneMap]="workflowStatusToneMap"></app-status-badge>
        </ng-template>
      </e-column>
      <e-column field="size" headerText="Size" width="80"></e-column>
      <e-column field="dueOnLabel" headerText="Due" width="110"></e-column>
      <e-column field="closedOnLabel" headerText="Closed" width="110"></e-column>
      <e-column field="weekOffsetLabel" headerText="สัปดาห์" width="130">
        <ng-template #template let-data>
          <app-status-badge [label]="data.weekOffsetLabel" [tone]="weekTone(data.weekOffsetLabel)"></app-status-badge>
        </ng-template>
      </e-column>
      <e-column field="unplannedLabel" headerText="แผน" width="110">
        <ng-template #template let-data>
          <app-status-badge [value]="data.unplannedLabel" [toneMap]="planToneMap"></app-status-badge>
        </ng-template>
      </e-column>
      <e-column headerText="Action" width="110" textAlign="Center" [allowFiltering]="false" [allowSorting]="false">
        <ng-template #template let-data>
          <button ejs-button cssClass="e-small e-outline" type="button" (click)="openDetail(data.id, $event)">
            ดูสรุป
          </button>
        </ng-template>
      </e-column>
    </e-columns>
  </ejs-grid>
</div>

<ejs-dialog
  #detailDialog
  header="สรุปใบงาน"
  width="480px"
  [visible]="false"
  [isModal]="true"
  [showCloseIcon]="true"
>
  <ng-template #content>
    @if (detail(); as row) {
      <div class="grid gap-2 text-sm">
        <p class="m-0 font-bold">{{ row.workLabel }}</p>
        <p class="m-0">ผู้รับ: {{ row.assignee }}</p>
        <p class="m-0 flex flex-wrap items-center gap-2">
          สถานะ:
          <app-status-badge [value]="row.status" [toneMap]="workflowStatusToneMap"></app-status-badge>
          · ขนาด {{ row.size }}
        </p>
        <p class="m-0">Due: {{ row.dueOnLabel }} · Closed: {{ row.closedOnLabel }}</p>
        <p class="m-0 flex flex-wrap items-center gap-2">
          <app-status-badge [label]="row.weekOffsetLabel" [tone]="weekTone(row.weekOffsetLabel)"></app-status-badge>
          <app-status-badge [value]="row.unplannedLabel" [toneMap]="planToneMap"></app-status-badge>
        </p>
      </div>
    }
  </ng-template>
  <ng-template #footerTemplate>
    <button ejs-button cssClass="e-primary" type="button" (click)="goToBoard()">เปิดในกระดานงาน (Board)</button>
  </ng-template>
</ejs-dialog>
