<app-section-card
  title="รายการใบงานปฏิบัติการ"
  subtitle="รายการใบงานแนวปฏิบัติงาน (ไม่ใช่ตารางคะแนน) · จัดกลุ่มตามโปรเจกต์ได้"
  [badge]="rows().length + ' ใบ'"
  badgeTone="info"
>
  <button
    actions
    ejs-button
    type="button"
    [cssClass]="groupByProject() ? 'e-primary e-small' : 'e-outline e-small'"
    (click)="toggleGroupByProject()"
  >
    {{ groupByProject() ? 'จัดกลุ่มโปรเจกต์: เปิด' : 'จัดกลุ่มโปรเจกต์: ปิด' }}
  </button>

  <ng-template #workTpl let-data>
    <button ejs-button cssClass="e-link e-small text-left font-semibold" type="button" (click)="openDetail(data.id, $event)">
      {{ data.workLabel }}
    </button>
  </ng-template>
  <ng-template #assigneeTpl let-data>
    <app-person-avatar [name]="data.assignee" [showName]="true" size="xs" />
  </ng-template>
  <ng-template #typeTpl let-data>
    <app-status-badge [label]="data.type" [tone]="typeTone(data.type)" />
  </ng-template>
  <ng-template #statusTpl let-data>
    <app-status-badge [value]="data.status" [toneMap]="workflowStatusToneMap" />
  </ng-template>
  <ng-template #policyDateTpl let-data>
    <span class="inline-flex items-center gap-1 font-mono text-xs">
      <span>{{ data.policyDateLabel }}</span>
      @if (data.policyAuto) {
        <span class="e-badge e-badge-violet e-badge-pill">Auto</span>
      }
    </span>
  </ng-template>
  <ng-template #policySlaTpl let-data>
    <app-status-badge [label]="data.policySlaLabel" [tone]="data.policySlaTone" />
  </ng-template>
  <ng-template #weekTpl let-data>
    <app-status-badge [label]="data.weekOffsetLabel" [tone]="weekTone(data.weekOffsetLabel)" />
  </ng-template>
  <ng-template #planTpl let-data>
    <app-status-badge [value]="data.unplannedLabel" [toneMap]="planToneMap" />
  </ng-template>
  <ng-template #actionTpl let-data>
    <button ejs-button cssClass="e-small e-outline" type="button" (click)="openDetail(data.id, $event)">
      ดูสรุป
    </button>
  </ng-template>

  <app-sf-grid
    [data]="rows()"
    [columns]="columns"
    [cellTemplates]="{
      workLabel: workTpl,
      type: typeTpl,
      assignee: assigneeTpl,
      status: statusTpl,
      policyDateLabel: policyDateTpl,
      policySlaLabel: policySlaTpl,
      weekOffsetLabel: weekTpl,
      unplannedLabel: planTpl,
      action: actionTpl
    }"
    [options]="gridOptions()"
    (rowSelected)="onRowSelected($event)"
  />
</app-section-card>
