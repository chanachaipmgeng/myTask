<div class="flex flex-col gap-4">
  @if (mdMandate().mdDirectCount > 0) {
    <div class="flex flex-wrap items-center gap-2">
      <span class="e-badge e-badge-warning e-badge-pill">MD MANDATE</span>
      <ejs-message
        severity="Warning"
        variant="Outlined"
        cssClass="grow"
        [content]="'ทีมรับงานด่วนสั่งตรงจาก MD รวม ' + mdMandate().mdDirectCount + ' ใบ คิดเป็น ' + mdMandate().mdDirectMd + ' MD (' + mdMandate().mdDirectSharePct + '% ของโหลดงานทั้งหมด) — คุ้มครองคะแนนความแม่นยำและ On-Time อัตโนมัติ'"
      ></ejs-message>
    </div>
  }

  <div class="kpi-grid-4">
    @for (card of view().cards; track card.id) {
      <app-kpi-stat
        [title]="card.label"
        [value]="card.value"
        [hint]="card.hint"
        [accent]="cardAccent(card.id)"
        layout="icon-start"
        [iconCss]="cardIcon(card.id)"
      ></app-kpi-stat>
    }
  </div>

  <ejs-dashboardlayout
    [columns]="4"
    [cellSpacing]="cellSpacing"
    [cellAspectRatio]="1.25"
    [allowDragging]="false"
    [allowResizing]="false"
    [allowFloating]="false"
    [showGridLines]="false"
    mediaQuery="max-width: 800px"
    (created)="onDashboardCreated()"
  >
    <div id="work-status" class="e-panel" data-row="0" data-col="0" data-sizex="2" data-sizey="2">
      <div class="e-panel-container">
        <div class="e-panel-header">สัดส่วนสถานะ</div>
        <div class="e-panel-content">
          <ejs-accumulationchart
            id="work-status-donut"
            style="display: block; height: 260px; width: 100%"
            [theme]="theme.sfTheme()"
            [legendSettings]="legend"
            [tooltip]="pieTooltip"
            [centerLabel]="statusCenter()"
            [enableAnimation]="true"
          >
            <e-accumulation-series-collection>
              <e-accumulation-series
                type="Pie"
                [dataSource]="view().statusShare"
                xName="x"
                yName="y"
                innerRadius="62%"
                radius="80%"
                legendShape="Circle"
                [dataLabel]="donutLabel"
                [palettes]="palette"
              ></e-accumulation-series>
            </e-accumulation-series-collection>
          </ejs-accumulationchart>
        </div>
      </div>
    </div>
    <div id="work-track" class="e-panel" data-row="0" data-col="2" data-sizex="2" data-sizey="2">
      <div class="e-panel-container">
        <div class="e-panel-header">สัดส่วนสาย</div>
        <div class="e-panel-content">
          <ejs-accumulationchart
            id="work-track-donut"
            style="display: block; height: 260px; width: 100%"
            [theme]="theme.sfTheme()"
            [legendSettings]="legend"
            [tooltip]="pieTooltip"
            [centerLabel]="trackCenter()"
            [enableAnimation]="true"
          >
            <e-accumulation-series-collection>
              <e-accumulation-series
                type="Pie"
                [dataSource]="view().trackShare"
                xName="x"
                yName="y"
                innerRadius="62%"
                radius="80%"
                legendShape="Circle"
                [dataLabel]="donutLabel"
                [palettes]="palette"
              ></e-accumulation-series>
            </e-accumulation-series-collection>
          </ejs-accumulationchart>
        </div>
      </div>
    </div>
    <div id="work-wip" class="e-panel" data-row="2" data-col="0" data-sizex="4" data-sizey="2">
      <div class="e-panel-container">
        <div class="e-panel-header">WIP ต่อคน (MD ประมาณ)</div>
        <div class="e-panel-content">
          <ejs-chart
            style="display: block; height: 260px; width: 100%"
            [theme]="theme.sfTheme()"
            [primaryXAxis]="categoryAxis"
            [primaryYAxis]="valueAxis"
            [tooltip]="tooltip"
            [legendSettings]="{ visible: false }"
            [chartArea]="chartArea"
            [enableAnimation]="true"
          >
            <e-series-collection>
              <e-series
                type="Column"
                [dataSource]="view().wipBars"
                xName="nickname"
                yName="openMd"
                name="WIP MD"
                fill="#4c68e5"
                columnWidth="0.55"
                [cornerRadius]="columnCorner"
              ></e-series>
            </e-series-collection>
          </ejs-chart>
        </div>
      </div>
    </div>
  </ejs-dashboardlayout>
</div>
