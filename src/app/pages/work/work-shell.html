<section class="page flex flex-col gap-4">
  <div class="page-head">
    <div>
      <h2>ฮับบริหารงาน (Work Hub)</h2>
      <p>สลับมุมมอง Summary · Timeline · Backlog · Board · List จากใบงานในระบบ — ไม่เปลี่ยนสูตรคะแนน</p>
    </div>
    <div class="flex flex-wrap gap-3 items-end">
      <a ejs-button cssClass="e-outline" routerLink="/tickets">ตารางคะแนนใบงาน (/tickets)</a>
      <label class="filter">
        <span>สายงาน</span>
        <ejs-dropdownlist
          [dataSource]="trackOptions"
          [fields]="fields"
          [value]="filter.track()"
          (change)="setTrack($event)"
          width="160px"
        ></ejs-dropdownlist>
      </label>
      <label class="filter">
        <span>ค้นหา</span>
        <ejs-textbox placeholder="รหัสหรือชื่อใบ" (change)="setQuery($event)" width="220px"></ejs-textbox>
      </label>
    </div>
  </div>

  <nav class="work-hub-tabs flex flex-wrap gap-2 border-b border-slate-700 pb-2" role="tablist" aria-label="มุมมองฮับบริหารงาน">
    @for (tab of tabs; track tab.path) {
      <a
        ejs-button
        role="tab"
        [id]="'work-tab-' + tab.path"
        [routerLink]="['/work', tab.path]"
        routerLinkActive="e-primary"
        [attr.aria-selected]="activePath() === tab.path"
        [cssClass]="activePath() === tab.path ? 'e-primary' : 'e-flat'"
      >
        {{ tab.text }}
      </a>
    }
  </nav>

  <router-outlet />
</section>
