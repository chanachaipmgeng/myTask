<section class="page flex flex-col gap-4">
  <app-page-head [title]="heading()" [description]="subheading()">
    <div actions class="flex flex-wrap gap-3 items-end">
      @if (!isMine()) {
        <a ejs-button cssClass="e-outline" routerLink="/tickets">ตารางคะแนนใบงาน (/tickets)</a>
      } @else {
        <a ejs-button cssClass="e-outline" routerLink="/me">ผลงานของฉัน (/me)</a>
      }
      <app-filter-chips
        [options]="trackChipOptions"
        [value]="filter.track()"
        (valueChange)="setTrackChip($event)"
      ></app-filter-chips>
      <app-form-field label="ค้นหา" variant="filter">
        <ejs-textbox placeholder="รหัสหรือชื่อใบ" (change)="setQuery($event)" width="220px"></ejs-textbox>
      </app-form-field>
    </div>
  </app-page-head>

  <nav class="work-hub-tabs flex flex-wrap gap-2" role="tablist" [attr.aria-label]="heading()">
    @for (tab of tabs(); track tab.path) {
      <a
        ejs-button
        role="tab"
        [id]="'work-tab-' + tab.path"
        [iconCss]="tab.icon"
        [routerLink]="[basePath(), tab.path]"
        routerLinkActive="e-primary"
        [attr.aria-selected]="activePath() === tab.path"
        [cssClass]="activePath() === tab.path ? 'e-primary' : 'e-flat'"
      >
        {{ tab.text }}
      </a>
    }
  </nav>

  <router-outlet />
</section>
