<section class="page flex flex-col gap-4">
  <app-page-head [title]="heading()" [description]="subheading()">
    <div actions class="flex flex-wrap gap-3 items-end">
      @if (!isMine()) {
        <a ejs-button cssClass="e-outline" routerLink="/quality/tickets">ตารางคะแนนใบงาน</a>
      } @else {
        <a ejs-button cssClass="e-outline" routerLink="/me">ผลงานของฉัน (/me)</a>
      }
      <button ejs-button cssClass="e-flat e-small" type="button" (click)="clearContext()">ล้างกรองสัปดาห์</button>
    </div>
  </app-page-head>

  <div class="work-context-bar" aria-label="บริบทสัปดาห์และค้นหาใบ">
    <p class="work-context-bar__line">{{ contextLine() }}</p>
    <div class="work-context-bar__filters">
      <app-form-field label="ค้นหา" variant="filter">
        <ejs-textbox placeholder="รหัสหรือชื่อใบ" [value]="filter.query()" (change)="setQuery($event)" width="200px"></ejs-textbox>
      </app-form-field>
    </div>
    <div class="work-context-bar__chips">
      <app-filter-chips
        [options]="weekChipOptions"
        [value]="'' + filter.weekOffset()"
        (valueChange)="setWeekChip($event)"
      ></app-filter-chips>
      <app-filter-chips
        [options]="dueBucketOptions"
        [value]="filter.dueBucket()"
        (valueChange)="setDueBucketChip($event)"
      ></app-filter-chips>
    </div>
  </div>

  <nav class="hub-underline-tabs" role="tablist" [attr.aria-label]="heading()">
    @for (tab of tabs(); track tab.path) {
      <a
        class="hub-underline-tab"
        role="tab"
        [id]="'work-tab-' + tab.path"
        [routerLink]="[basePath(), tab.path]"
        queryParamsHandling="preserve"
        [class.is-active]="activePath() === tab.path"
        [attr.aria-selected]="activePath() === tab.path"
      >
        <span [class]="tab.icon" aria-hidden="true"></span>
        <span>{{ tab.text }}</span>
      </a>
    }
  </nav>

  <router-outlet />
</section>
