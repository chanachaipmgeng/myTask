<section class="page org-teams-hub flex flex-col gap-4">
  <app-page-head
    title="ทีมในองค์กร"
    description="เลือกการ์ดทีมเพื่อเข้า Workspace — ดูคน งาน คะแนน และค็อกพิทของทีมนั้น (กรองด้วย teamId ข้ามหน้า)"
    [metrics]="[
      { label: 'จำนวนทีม', value: '' + cards().length },
      { label: 'สมาชิก active', value: '' + totalMembers() },
    ]"
  >
    <div actions class="flex flex-wrap gap-2 items-center">
      <app-sf-textbox
        placeholder="ค้นหาชื่อทีมหรือสายงาน..."
        [value]="query()"
        [clearButton]="true"
        width="240px"
        (valueInput)="query.set($event)"
        (valueChange)="query.set($event)"
      />
      @if (workspace.teamId()) {
        <button ejs-button cssClass="e-outline e-small" type="button" (click)="clearTeam()">ล้างทีมที่เลือก</button>
      }
    </div>
  </app-page-head>

  <div class="org-teams-hub__grid" role="list">
    @for (card of cards(); track card.id) {
      <button
        type="button"
        class="org-team-card"
        role="listitem"
        (click)="openTeam(card.id)"
        [attr.aria-label]="'เปิดทีม ' + card.name"
      >
        <app-section-card
          [title]="card.name"
          [subtitle]="card.trackSummary"
          [badge]="card.memberCount + ' คน'"
          badgeTone="info"
          variant="nested"
        >
          <div class="org-team-card__body">
            <div class="org-team-card__meta flex items-center gap-2">
              <span class="org-team-card__label">Lead</span>
              <app-person-avatar [personId]="card.leadId" [name]="card.leadName" [showName]="true" size="xs"></app-person-avatar>
            </div>
            @let preview = teamMembersPreview(card.id);
            @if (preview.length) {
              <div class="flex items-center gap-2 mt-2">
                <div class="flex items-center -space-x-2">
                  @for (m of preview; track m.id) {
                    <app-person-avatar [personId]="m.id" [name]="m.nickname" size="sm"></app-person-avatar>
                  }
                </div>
                @if (card.memberCount > preview.length) {
                  <span class="px-2 py-0.5 rounded-full text-xs font-semibold bg-blue-500/15 text-blue-600 dark:text-blue-300 tabular-nums">
                    +{{ card.memberCount - preview.length }}
                  </span>
                }
              </div>
            }
            <p class="org-team-card__hint">คลิกเพื่อเข้า Workspace ทีม</p>
          </div>
        </app-section-card>
      </button>
    } @empty {
      <app-section-card
        [title]="query().trim() ? 'ไม่พบทีมตามคำค้นหา' : 'ยังไม่มีทีม'"
        [subtitle]="query().trim() ? 'ลองเปลี่ยนคำค้นหาหรือล้างช่องค้นหา' : 'ซิงก์ผู้ใช้จาก OpenProject หรือตรวจ people.teamId'"
      >
        <p class="text-sm opacity-80">
          {{ query().trim() ? 'ปรับคำค้นหาแล้วลองใหม่' : 'เมื่อมีทีมใน bootstrap จะแสดงเป็นการ์ดที่นี่' }}
        </p>
      </app-section-card>
    }
  </div>
</section>
