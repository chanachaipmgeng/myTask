<div class="login-shell">
  <div class="login-shell__ambient" aria-hidden="true">
    <span class="login-orb login-orb--a"></span>
    <span class="login-orb login-orb--b"></span>
    <span class="login-orb login-orb--c"></span>
  </div>

  <aside class="login-brand" appReveal="slide-right" [revealDuration]="480">
    <div class="login-brand__mark" aria-hidden="true">
      <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
    </div>
    <p class="login-brand__eyebrow">MyHR Plus</p>
    <h1 class="login-brand__title">myTask</h1>
    <p class="login-brand__tagline">ประเมินผลงานส่งมอบด้วย Man-day อย่างเป็นธรรม</p>
  </aside>

  <main class="login-panel">
    <div
      class="login-card"
      appReveal="scale-soft"
      [revealDelay]="120"
      [revealDuration]="420"
    >
      <header class="login-card__head">
        <h2 class="login-card__title">เข้าสู่ระบบ</h2>
        <p class="login-card__sub">ใช้บัญชีองค์กร หรือ GitLab SSO</p>
      </header>

      <app-flash-messages [success]="message() || null" [error]="error() || null"></app-flash-messages>

      <form class="login-form" appStagger [staggerStep]="55" (submit)="submitLogin($event)">
        <div class="login-field">
          <label class="login-label" for="login-username">ชื่อผู้ใช้หรืออีเมล</label>
          <div class="login-input-wrap">
            <span class="e-icons e-user login-input-icon" aria-hidden="true"></span>
            <input
              id="login-username"
              type="text"
              class="login-input"
              placeholder="paweena หรือ paweena@myhr.co.th"
              [value]="username()"
              (input)="onUsernameInput($event)"
              autocomplete="username"
              required
            />
          </div>
        </div>

        <div class="login-field">
          <div class="login-label-row">
            <label class="login-label" for="login-password">รหัสผ่าน</label>
            <button type="button" class="login-text-btn" (click)="onForgotPassword()">ลืมรหัสผ่าน?</button>
          </div>
          <div class="login-input-wrap">
            <span class="e-icons e-lock login-input-icon" aria-hidden="true"></span>
            <input
              id="login-password"
              [type]="showPassword() ? 'text' : 'password'"
              class="login-input"
              placeholder="••••••••"
              [value]="password()"
              (input)="onPasswordInput($event)"
              autocomplete="current-password"
            />
            <button
              type="button"
              class="login-eye"
              (click)="togglePassword()"
              [attr.aria-label]="showPassword() ? 'ซ่อนรหัสผ่าน' : 'แสดงรหัสผ่าน'"
            >
              <span class="e-icons" [class.e-eye]="!showPassword()" [class.e-eye-slash]="showPassword()"></span>
            </button>
          </div>
        </div>

        <div class="login-options">
          <app-sf-checkbox
            label="จดจำฉัน 30 วัน"
            [checked]="rememberMe()"
            (checkedChange)="rememberMe.set($event)"
          />
        </div>

        <button
          ejs-button
          cssClass="e-primary login-submit"
          type="submit"
          [disabled]="busy()"
        >
          @if (busy()) {
            <span class="e-icons e-spinner e-spin" aria-hidden="true"></span>
            <span>กำลังเข้าสู่ระบบ…</span>
          } @else {
            <span>เข้าสู่ระบบ</span>
          }
        </button>

        <div class="login-divider" aria-hidden="true"><span>หรือ</span></div>

        <button
          ejs-button
          cssClass="e-outline login-sso"
          type="button"
          (click)="startGitLabSso()"
        >
          <svg class="login-sso__icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
            <path fill="#FC6D26" d="M22.65 14.39L20.61 8.12a.66.66 0 0 0-.25-.33.64.64 0 0 0-.41-.12.63.63 0 0 0-.4.14.65.65 0 0 0-.23.34L17.5 13.9H6.5L4.68 8.15a.65.65 0 0 0-.23-.34.63.63 0 0 0-.4-.14.64.64 0 0 0-.41.12.66.66 0 0 0-.25.33l-2.04 6.27a.88.88 0 0 0 .32 1l9.88 7.18a.65.65 0 0 0 .76 0l9.88-7.18a.88.88 0 0 0 .32-1z"/>
          </svg>
          <span>GitLab SSO</span>
        </button>

        @if (canUseDevLogin()) {
          <div class="login-demo">
            <p class="login-demo__label">ทดสอบด่วน</p>
            <div class="login-demo__chips">
              <button type="button" class="login-chip" (click)="quickLogin('paweena')">ปวีณา · Admin</button>
              <button type="button" class="login-chip" (click)="quickLogin('chanachai')">ชนะชัย · Admin</button>
              <button type="button" class="login-chip" (click)="quickLogin('nakarin')">นครินทร์ · Member</button>
            </div>
          </div>
        }

        <button
          type="button"
          class="login-sync"
          [disabled]="busy()"
          (click)="syncMyProjectUsers()"
        >
          {{ busy() ? 'กำลังซิงค์…' : 'ซิงค์รายชื่อจาก myProject' }}
        </button>
      </form>
    </div>
  </main>
</div>
