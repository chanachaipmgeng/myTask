<section class="page people-board flex flex-col gap-4">
  <app-page-head
    title="กระดานดัชนีพนักงาน"
    [description]="'เปรียบเทียบดัชนีรายคน · เป้า ' + target + ' · จัดการลูกทีมแบบ Workspace ที่ «ทีม»'"
    [metrics]="quotaMetrics()"
  >
    <div actions class="flex flex-wrap gap-3 items-end">
      <a ejs-button cssClass="e-primary e-small" routerLink="/workspace/people" queryParamsHandling="preserve">
        เปิด Workspace คน
      </a>
      <a ejs-button cssClass="e-outline e-small" routerLink="/org/teams" queryParamsHandling="preserve">ทีมการ์ด</a>
      <app-form-field label="ค้นหาชื่อ" variant="filter">
        <app-sf-textbox
          placeholder="ชื่อหรือบทบาท"
          width="200px"
          (valueInput)="query.set($event)"
          (valueChange)="query.set($event)"
        />
      </app-form-field>
    </div>
  </app-page-head>

  <app-section-card
    [title]="'กราฟดัชนีพัฒนาการเทียบเกณฑ์มาตรฐาน (' + target + ')'"
    subtitle="โควต้าใช้จัดกำลังคนอย่างเดียว ไม่เข้าสูตร. คอลัมน์ WIP คือใบที่ยังไม่ปิด ความแม่นคือสัดส่วนใบที่อัตราส่วน actual/estimate อยู่ใน 0.8–1.5. 1 MD = 6 ชั่วโมงโฟกัส."
    [badge]="'เป้า ' + target"
    badgeTone="secondary"
  >
    <div class="chart-frame m-0">
      <app-sf-chart
        [series]="chartSeries()"
        [primaryXAxis]="primaryXAxis"
        [primaryYAxis]="primaryYAxis"
        [options]="chartOptions"
      />
    </div>
  </app-section-card>

  <app-section-card
    title="ตารางสรุปผลงานและโควตารายคน"
    subtitle="คลิกที่ชื่อพนักงานเพื่อเปิดหน้าโปรไฟล์และกราฟวิเคราะห์เชิงลึกรายบุคคล"
    [badge]="rows().length + ' คน'"
    badgeTone="info"
  >
    <ng-template #personTpl let-data>
      <a
        class="person-link inline-flex items-center gap-2"
        [routerLink]="['/people', data.id]"
        [queryParams]="{
          teamId: workspace.teamId() || null,
          track: workspace.track() === 'All' ? null : workspace.track(),
          project: workspace.opProject() || null
        }"
      >
        <app-person-avatar [personId]="data.id" [name]="data.personLabel" size="sm" />
        <span>{{ data.personLabel }}</span>
      </a>
    </ng-template>
    <ng-template #trackTpl let-data>
      <app-status-badge [value]="data.trackLabel" [toneMap]="trackToneMap" />
    </ng-template>
    <ng-template #indexTpl let-data>
      <div class="grid-index-cell">
        <span class="grid-index-value">{{ data.index | number: '1.0-1' }}</span>
        <app-sf-progress
          [id]="'people-index-' + data.id"
          class="grid-cell-progress"
          height="12"
          [value]="data.index"
          [options]="{ tone: 'auto' }"
        />
      </div>
    </ng-template>
    <ng-template #alertTpl let-data>
      <app-status-badge [label]="data.alertLabel" [tone]="alertTone(data.alertLabel)" />
    </ng-template>

    <app-sf-grid
      [data]="rows()"
      [columns]="gridColumns"
      [cellTemplates]="{
        personLabel: personTpl,
        trackLabel: trackTpl,
        index: indexTpl,
        alertLabel: alertTpl
      }"
      [aggregates]="gridAggregates"
      [options]="gridOptions"
      (rowSelected)="openPerson($event)"
    />
  </app-section-card>
</section>
