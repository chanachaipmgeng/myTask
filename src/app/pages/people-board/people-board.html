<section class="page people-board flex flex-col gap-4">
  <app-page-head
    title="รายชื่อพนักงาน"
    [description]="'คลิกชื่อเพื่อดูงานของคนนั้นและกราฟวิเคราะห์หลายมุม เป้าดัชนีคือ ' + target + '.'"
    [metrics]="quotaMetrics()"
  >
    <div actions class="flex flex-wrap gap-3 items-end">
      <app-filter-chips
        [options]="trackChipOptions()"
        [value]="track()"
        (valueChange)="setTrackChip($event)"
      ></app-filter-chips>
      <app-form-field label="ค้นหาชื่อ" variant="filter">
        <ejs-textbox placeholder="ชื่อหรือบทบาท" (change)="setQuery($event)" width="200px"></ejs-textbox>
      </app-form-field>
    </div>
  </app-page-head>

  <app-section-card
    [title]="'กราฟดัชนีพัฒนาการเทียบเกณฑ์มาตรฐาน (' + target + ')'"
    subtitle="โควต้าใช้จัดกำลังคนอย่างเดียว ไม่เข้าสูตร. คอลัมน์ WIP คือใบที่ยังไม่ปิด ความแม่นคือสัดส่วนใบที่อัตราส่วน actual/estimate อยู่ใน 0.8–1.5. 1 MD = 6 ชั่วโมงโฟกัส."
    [badge]="'เป้า ' + target"
    badgeTone="secondary"
  >
    <div class="chart-frame m-0">
      <ejs-chart
        style="display: block; height: 420px; width: 100%"
        [theme]="theme.sfTheme()"
        [primaryXAxis]="primaryXAxis"
        [primaryYAxis]="primaryYAxis"
        [margin]="{ top: 14, right: 18, bottom: 28, left: 12 }"
        [tooltip]="tooltip"
        [legendSettings]="legend"
        [chartArea]="chartArea"
        [enableAnimation]="false"
      >
        <e-series-collection>
          <e-series
            type="Column"
            [dataSource]="rows()"
            xName="nickname"
            yName="index"
            pointColorMapping="color"
            name="ดัชนีพัฒนา"
            columnWidth="0.52"
            [cornerRadius]="{ topLeft: 8, topRight: 8 }"
          ></e-series>
        </e-series-collection>
      </ejs-chart>
    </div>
  </app-section-card>

  <app-section-card
    title="ตารางสรุปผลงานและโควตารายคน"
    subtitle="คลิกที่ชื่อพนักงานเพื่อเปิดหน้าโปรไฟล์และกราฟวิเคราะห์เชิงลึกรายบุคคล"
    [badge]="rows().length + ' คน'"
    badgeTone="info"
  >
    <ejs-grid
      #peopleGrid
      [dataSource]="rows()"
      [allowPaging]="true"
      [allowSorting]="true"
      [allowFiltering]="true"
      [allowResizing]="true"
      [showColumnChooser]="true"
      [allowExcelExport]="true"
      [toolbar]="toolbar"
      [pageSettings]="pageSettings"
      [filterSettings]="filterSettings"
      [sortSettings]="sortSettings"
      (toolbarClick)="onToolbarClick($event)"
      (rowSelected)="openPerson($event)"
      height="auto"
    >
      <e-columns>
        <e-column field="personLabel" headerText="พนักงาน" width="190" [isFrozen]="!viewport.isMobile()">
          <ng-template #template let-data>
            <a class="person-link" [routerLink]="['/people', data.id]" [queryParams]="{ teamId: workspace.teamId() || null, track: workspace.track() === 'All' ? null : workspace.track(), project: workspace.opProject() || null }">{{ data.personLabel }}</a>
          </ng-template>
        </e-column>
        <e-column field="levelLabel" headerText="ระดับ" width="110"></e-column>
        <e-column field="trackLabel" headerText="สาย" width="110">
          <ng-template #template let-data>
            <app-status-badge [value]="data.trackLabel" [toneMap]="trackToneMap"></app-status-badge>
          </ng-template>
        </e-column>
        <e-column field="quota" headerText="โควต้า" width="95" textAlign="Right" format="N1"></e-column>
        <e-column field="openCount" headerText="WIP" width="85" textAlign="Right"></e-column>
        <e-column field="closedCount" headerText="ปิดแล้ว" width="105" textAlign="Right"></e-column>
        <e-column field="index" headerText="ดัชนี" width="160">
          <ng-template #template let-data>
            <div class="grid-index-cell">
              <span class="grid-index-value">{{ data.index | number: '1.0-1' }}</span>
              <ejs-progressbar
                [id]="'people-index-' + data.id"
                class="grid-cell-progress"
                type="Linear"
                height="12"
                [minimum]="0"
                [maximum]="100"
                [value]="data.index"
                [theme]="theme.sfTheme()"
                [trackColor]="theme.progressTrack()"
                [progressColor]="indexProgressFill(data.index)"
              ></ejs-progressbar>
            </div>
          </ng-template>
        </e-column>
        <e-column field="planLabel" headerText="ปิดตามแผน" width="200"></e-column>
        <e-column field="accuracyLabel" headerText="ความแม่น" width="110"></e-column>
        <e-column field="weighted" headerText="คะแนนถ่วง" width="115" textAlign="Right" format="N1"></e-column>
        <e-column field="reworkPct" headerText="Rework %" width="115" textAlign="Right" format="N1"></e-column>
        <e-column field="sideLabel" headerText="นอกแผน / Spike" width="150"></e-column>
        <e-column field="alertLabel" headerText="แจ้งเตือน" width="160">
          <ng-template #template let-data>
            <app-status-badge [label]="data.alertLabel" [tone]="alertTone(data.alertLabel)"></app-status-badge>
          </ng-template>
        </e-column>
      </e-columns>
      <e-aggregates>
        <e-aggregate>
          <e-columns>
            <e-column type="Count" field="personLabel">
              <ng-template #footerTemplate let-data><span class="tabular-nums">รวม {{ data.Count }} คน</span></ng-template>
            </e-column>
            <e-column type="Sum" field="quota" format="N1">
              <ng-template #footerTemplate let-data><span class="tabular-nums">รวม {{ data.Sum }}</span></ng-template>
            </e-column>
            <e-column type="Sum" field="openCount">
              <ng-template #footerTemplate let-data><span class="tabular-nums">รวม {{ data.Sum }}</span></ng-template>
            </e-column>
            <e-column type="Sum" field="closedCount">
              <ng-template #footerTemplate let-data><span class="tabular-nums">รวม {{ data.Sum }}</span></ng-template>
            </e-column>
            <e-column type="Average" field="index" format="N1">
              <ng-template #footerTemplate let-data><span class="tabular-nums">เฉลี่ย {{ data.Average }}</span></ng-template>
            </e-column>
          </e-columns>
        </e-aggregate>
      </e-aggregates>
    </ejs-grid>
  </app-section-card>
</section>
