<section class="page flex flex-col gap-4">
  <app-page-head
    [title]="isMine ? 'ซิงก์และตรวจสอบ GitLab MR ของฉัน' : 'ซิงก์ mygit (GitLab MR ทีม)'"
    description="ดึงข้อมูล Merge Request / รอบรีวิว / reopen และลิงก์ MR จากไฟล์ตัวอย่างในเครื่อง หรือจาก GitLab API v4 เพื่อเติมลงใบงานที่จับคู่รหัสได้ (ไม่นับจำนวนไฟล์หรือจำนวน commit เป็นคะแนน)"
  >
    <div actions class="flex flex-wrap items-center gap-2">
      @if (isMine) {
        <a ejs-button cssClass="e-outline" iconCss="e-icons e-table-1" routerLink="/me/tickets">
          แนบลิงก์ MR ในตารางใบงานของฉัน
        </a>
      }
      @if (gitlabInfo(); as info) {
        <span
          class="e-badge"
          [class.e-badge-success]="info.configured && info.enabled"
          [class.e-badge-secondary]="!info.configured || !info.enabled"
        >
          {{ info.configured && info.enabled ? 'GitLab API พร้อมซิงก์' : 'โหมดไฟล์ตัวอย่าง' }}
        </span>
      }
    </div>
  </app-page-head>

  @if (isMine) {
    <app-section-card
      title="สถานะลิงก์ Merge Request ในใบงานของฉัน"
      subtitle="ตรวจสอบว่าใบงานที่รับผิดชอบแนบลิงก์ MR ครบถ้วนก่อนส่งตรวจ DoD Gate"
      [badge]="myTicketsWithMr().length + ' ใบ'"
      badgeTone="info"
    >
      <ejs-grid
        [dataSource]="myTicketsWithMr()"
        [allowPaging]="true"
        [allowResizing]="true"
        [pageSettings]="pageSettings"
        height="240"
      >
        <e-columns>
          <e-column field="id" headerText="รหัสใบงาน" width="120"></e-column>
          <e-column field="title" headerText="ชื่องาน / โมดูล" width="220"></e-column>
          <e-column field="status" headerText="สถานะงาน" width="140"></e-column>
          <e-column field="mrLink" headerText="ลิงก์ Merge Request" width="260">
            <ng-template #template let-data>
              <app-status-badge
                [label]="data.mrLink"
                [tone]="data.hasMr ? 'success' : 'warning'"
              ></app-status-badge>
            </ng-template>
          </e-column>
          <e-column field="reviewRounds" headerText="รอบรีวิว" width="105" textAlign="Right"></e-column>
          <e-column field="reopenCount" headerText="Reopen" width="105" textAlign="Right"></e-column>
        </e-columns>
      </ejs-grid>
    </app-section-card>
  }

  <app-section-card
    title="สั่งซิงก์ข้อมูล Merge Request"
    subtitle="เลือกดึงจากไฟล์ตัวอย่างในเครื่องเพื่อทดสอบ หรือดึงจาก GitLab API v4 จริง"
  >
    <div actions class="flex flex-wrap gap-2">
      <button ejs-button [isPrimary]="true" type="button" id="mygit-sync" (click)="sync()">ซิงก์จากไฟล์ตัวอย่าง</button>
      @if (canSyncApi()) {
        <button ejs-button cssClass="e-info" type="button" id="mygit-sync-api" [disabled]="syncing()" (click)="syncFromGitLabApi()">
          ซิงก์ MR จาก GitLab API
        </button>
      }
    </div>

    @if (message()) {
      <ejs-message [content]="message()" severity="Success" variant="Outlined"></ejs-message>
    }
    @if (error()) {
      <ejs-message [content]="error()" severity="Error" variant="Outlined"></ejs-message>
    }

    @if (!synced()) {
      <ejs-message content="ยังไม่ได้ซิงก์ กดปุ่มด้านบนเพื่ออ่านไฟล์ตัวอย่างในเครื่อง หรือดึงจาก GitLab API" severity="Info" variant="Outlined"></ejs-message>
    }
  </app-section-card>

  @if (synced()) {
    <app-section-card
      title="ใบงานที่จับคู่ MR ได้"
      subtitle="อัปเดตลิงก์ MR, รอบรีวิว และจำนวน Reopen ลงในใบงานอัตโนมัติ"
      [badge]="matched().length + ' รายการ'"
      badgeTone="success"
    >
      <ejs-grid [dataSource]="matched()" [allowPaging]="true" [allowResizing]="true" [pageSettings]="pageSettings" height="220">
        <e-columns>
          <e-column field="sha" headerText="Commit / MR" width="120"></e-column>
          <e-column field="ticketId" headerText="ใบงาน" width="140"></e-column>
          <e-column field="reviewRounds" headerText="รอบรีวิว" width="110" textAlign="Right"></e-column>
          <e-column field="reopenCount" headerText="Reopen" width="100" textAlign="Right"></e-column>
          <e-column field="reviewBefore" headerText="คะแนนรีวิวก่อน" width="140" textAlign="Right"></e-column>
          <e-column field="reviewAfter" headerText="คะแนนรีวิวหลัง" width="140" textAlign="Right"></e-column>
          <e-column field="mrLink" headerText="ลิงก์ MR" width="220"></e-column>
          <e-column field="mergedAt" headerText="เวลา merge" width="190"></e-column>
          <e-column field="message" headerText="ข้อความ" width="260"></e-column>
        </e-columns>
      </ejs-grid>
    </app-section-card>

    <app-section-card
      title="Commit / MR ที่จับใบงานไม่ได้"
      subtitle="รายการที่ไม่มีรหัสใบงานตรงกับระบบ"
      [badge]="unmatched().length + ' รายการ'"
      badgeTone="warning"
    >
      <ejs-grid [dataSource]="unmatched()" [allowPaging]="true" [allowResizing]="true" [pageSettings]="pageSettings" height="180">
        <e-columns>
          <e-column field="sha" headerText="Commit / MR" width="120"></e-column>
          <e-column field="ticketId" headerText="รหัสที่อ้าง" width="140"></e-column>
          <e-column field="mergedAt" headerText="เวลา merge" width="200"></e-column>
          <e-column field="message" headerText="ข้อความ" width="320"></e-column>
        </e-columns>
      </ejs-grid>
    </app-section-card>
  }
</section>
