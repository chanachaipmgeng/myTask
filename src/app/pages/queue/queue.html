<section class="page">
  <app-page-head
    title="คิวงานใหม่"
    description="ใบที่ยังไม่มีผู้รับ แยก R&amp;D กับ Implement. คนว่าง = โควต้าสัปดาห์ − MD ของใบที่ยังไม่ปิด − 1 MD ที่กันไว้นอกแผน. WIP ไม่เกิน 2 และ XL ไม่เกิน 1 ใบต่อคน. ข้อเสนอไม่ย้ายใบจนกว่าจะกดรับ · เฉพาะ admin/lead"
  ></app-page-head>

  @if (!canAssign()) {
    <ejs-message
      content="บัญชีนี้เป็น member — ดูคิวได้อย่างเดียว รับข้อเสนอได้เฉพาะ admin หรือ lead"
      severity="Info"
      variant="Outlined"
    ></ejs-message>
  }

  <app-flash-messages [success]="message()" [error]="error()"></app-flash-messages>

  <ejs-toolbar id="queue-toolbar" cssClass="page-toolbar" overflowMode="Scroll" width="100%">
    <e-items>
      <e-item text="กดรับข้อเสนอก่อน ใบจึงจะย้าย"></e-item>
      <e-item type="Separator"></e-item>
      <e-item [template]="freeTemplate"></e-item>
    </e-items>
  </ejs-toolbar>
  <ng-template #freeTemplate>
    <div class="free-line" id="free-people">
      @if (freePeople().length === 0) {
        <ejs-message content="ไม่มีคนว่างในโควต้านี้" severity="Info" variant="Outlined"></ejs-message>
      } @else {
        <span class="toolbar-field"><span>คนว่าง</span></span>
        <ejs-chiplist [chips]="freeChips()" selection="None" cssClass="free-chips"></ejs-chiplist>
      }
    </div>
  </ng-template>

  <app-section-card
    title="กำลังคนที่เหลือในสัปดาห์"
    subtitle="ตรวจสอบโควตาคงเหลือหลังหักใบงานเปิดและสำรองนอกแผน 1 MD"
    [badge]="'ว่าง ' + freePeople().length + ' คน'"
    badgeTone="info"
  >
    <ejs-grid [dataSource]="plan().rows" [allowPaging]="true" [allowResizing]="true" [pageSettings]="pageSettings" height="320">
      <e-columns>
        <e-column field="personLabel" headerText="คน" width="180"></e-column>
        <e-column field="trackLabel" headerText="สาย" width="120"></e-column>
        <e-column field="level" headerText="ระดับ" width="110"></e-column>
        <e-column field="quota" headerText="โควต้า" width="100" textAlign="Right" format="N1"></e-column>
        <e-column field="openMd" headerText="MD ที่เปิดอยู่" width="130" textAlign="Right" format="N2"></e-column>
        <e-column field="freeMd" headerText="ว่างหลังกัน 1 MD" width="150" textAlign="Right" format="N2"></e-column>
        <e-column field="wipLabel" headerText="WIP" width="90"></e-column>
        <e-column field="xlLabel" headerText="XL" width="80"></e-column>
        <e-column field="status" headerText="สถานะ" width="110"></e-column>
      </e-columns>
    </ejs-grid>
  </app-section-card>

  <div class="card-grid-2">
    <app-section-card
      title="คิวสาย Implement"
      subtitle="ใบงานสาย Implement ที่รอจัดสรรผู้รับผิดชอบ"
      [badge]="implementQueue().length + ' ใบ'"
      badgeTone="primary"
    >
      <ejs-grid class="queue-grid" [dataSource]="implementQueue()" [allowPaging]="true" [allowResizing]="true" [pageSettings]="pageSettings" height="240">
        <e-columns>
          <e-column field="id" headerText="รหัส" width="120"></e-column>
          <e-column field="type" headerText="ชนิด" width="140"></e-column>
          <e-column field="module" headerText="โมดูล" width="120"></e-column>
          <e-column field="size" headerText="ขนาด" width="80"></e-column>
          <e-column field="estimateMd" headerText="Est" width="90" textAlign="Right" format="N2"></e-column>
          <e-column field="assignee" headerText="ผู้รับ" width="150"></e-column>
        </e-columns>
      </ejs-grid>
    </app-section-card>

    <app-section-card
      title="คิวสาย R&amp;D"
      subtitle="ใบงานสาย R&amp;D / Spike ที่รอจัดสรรผู้รับผิดชอบ"
      [badge]="researchQueue().length + ' ใบ'"
      badgeTone="info"
    >
      <ejs-grid class="queue-grid" [dataSource]="researchQueue()" [allowPaging]="true" [allowResizing]="true" [pageSettings]="pageSettings" height="240">
        <e-columns>
          <e-column field="id" headerText="รหัส" width="120"></e-column>
          <e-column field="type" headerText="ชนิด" width="140"></e-column>
          <e-column field="module" headerText="โมดูล" width="120"></e-column>
          <e-column field="size" headerText="ขนาด" width="80"></e-column>
          <e-column field="estimateMd" headerText="Est" width="90" textAlign="Right" format="N2"></e-column>
          <e-column field="assignee" headerText="ผู้รับ" width="150"></e-column>
        </e-columns>
      </ejs-grid>
    </app-section-card>
  </div>

  <app-section-card
    title="วิเคราะห์แผนและข้อเสนอรับงาน"
    subtitle="ข้อเสนอการจับคู่ใบงานกับพนักงานที่โควตาว่างและ WIP ยังไม่เต็ม"
    [badge]="plan().plans.length + ' รายการ'"
    badgeTone="secondary"
  >
    <div class="grid grid-cols-1 gap-3">
      @for (item of plan().plans; track item.ticket.id) {
        <div class="e-card">
          <div class="e-card-content flex flex-col gap-3 p-4 md:flex-row md:items-center md:justify-between">
            <p class="m-0">{{ item.text }}</p>
            @if (item.personId) {
              <div class="flex items-center gap-2">
                <button
                  ejs-button
                  [isPrimary]="true"
                  type="button"
                  [attr.data-ticket]="item.ticket.id"
                  [disabled]="!canAssign() || accepting()"
                  (click)="accept(item)"
                >
                  รับข้อเสนอ
                </button>
                <button
                  ejs-button
                  cssClass="e-outline e-warning"
                  type="button"
                  title="จ่ายงานแทรกพร้อมสั่ง Auto-Shift เลื่อนวันส่งงานเดิมของน้องทันที"
                  [disabled]="!canAssign() || accepting()"
                  (click)="acceptAsMdDirect(item)"
                >
                  ⚡ รับงานด่วน MD &amp; เลื่อนงานเดิม
                </button>
              </div>
            }
          </div>
        </div>
      }
    </div>
  </app-section-card>
</section>

<app-confirm-dialog
  #writebackConfirm
  dialogId="queueWritebackDialog"
  header="ยืนยันเขียนกลับ OpenProject"
  [message]="writebackMessage()"
  confirmLabel="ยืนยันและรับข้อเสนอ"
  [confirmDisabled]="accepting()"
  width="480px"
  (confirmed)="confirmWriteback()"
  (cancelled)="cancelWriteback()"
></app-confirm-dialog>
