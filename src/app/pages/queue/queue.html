<section class="page">
  <app-page-head
    title="คิวงานใหม่"
    description="ใบที่ยังไม่มีผู้รับ แยก R&amp;D กับ Implement. คนว่าง = โควต้าสัปดาห์ − MD ของใบที่ยังไม่ปิด − 1 MD ที่กันไว้นอกแผน. WIP ไม่เกิน 2 และ XL ไม่เกิน 1 ใบต่อคน. ข้อเสนอไม่ย้ายใบจนกว่าจะกดรับ · เฉพาะ admin/lead"
  ></app-page-head>

  @if (!canAssign()) {
    <app-sf-message
      content="บัญชีนี้เป็น member — ดูคิวได้อย่างเดียว รับข้อเสนอได้เฉพาะ admin หรือ lead"
      severity="Info"
    />
  }

  <app-flash-messages [success]="message()" [error]="error()"></app-flash-messages>

  <app-section-card
    title="กำลังคนที่เหลือในสัปดาห์"
    subtitle="ตรวจสอบโควตาคงเหลือหลังหักใบงานเปิดและสำรองนอกแผน 1 MD · กดรับข้อเสนอที่ด้านล่างเพื่อจ่ายใบงาน"
    [badge]="'ว่าง ' + freePeople().length + ' คน'"
    badgeTone="info"
  >
    <app-sf-grid
      [data]="plan().rows"
      [columns]="capacityColumns"
      [options]="capacityGridOptions"
    />
  </app-section-card>

  <div class="card-grid-2">
    <app-section-card
      title="คิวสาย Implement"
      subtitle="ใบงานสาย Implement ที่รอจัดสรรผู้รับผิดชอบ"
      [badge]="implementQueue().length + ' ใบ'"
      badgeTone="primary"
    >
      <app-sf-grid
        [data]="implementQueue()"
        [columns]="queueColumns"
        [options]="queueGridOptions"
        (cellAction)="openTicket($event.row.id)"
      />
    </app-section-card>

    <app-section-card
      title="คิวสาย R&amp;D"
      subtitle="ใบงานสาย R&amp;D / Spike ที่รอจัดสรรผู้รับผิดชอบ"
      [badge]="researchQueue().length + ' ใบ'"
      badgeTone="info"
    >
      <app-sf-grid
        [data]="researchQueue()"
        [columns]="queueColumns"
        [options]="queueGridOptions"
        (cellAction)="openTicket($event.row.id)"
      />
    </app-section-card>
  </div>

  <app-section-card
    title="วิเคราะห์แผนและข้อเสนอรับงาน"
    subtitle="ข้อเสนอการจับคู่ใบงานกับพนักงานที่โควตาว่างและ WIP ยังไม่เต็ม (แสดงใบงานพร้อมจ่ายก่อน และตัวอย่างงานค้างรับ)"
    [badge]="plan().plans.length + ' รายการ' + (actionablePlans().length ? ' (พร้อมจ่าย ' + actionablePlans().length + ' ใบ)' : '')"
    badgeTone="secondary"
  >
    <div class="grid grid-cols-1 gap-3">
      @for (item of displayPlans(); track item.ticket.id) {
        <app-section-card variant="nested" [showHead]="false">
          <div
            class="flex flex-col gap-3 md:flex-row md:items-center md:justify-between pl-3 border-l-4"
            [class.border-emerald-500]="!!item.personId"
            [class.border-amber-500]="!item.personId"
          >
            <div class="flex flex-col gap-1.5 min-w-0">
              <div class="flex flex-wrap items-center gap-2">
                <button ejs-button cssClass="e-link e-small font-bold p-0" type="button" (click)="openTicket(item.ticket.id)">
                  {{ item.ticket.id }}
                </button>
                <app-status-badge [label]="item.ticket.size + ' · ' + item.ticket.estimateMd + ' MD'" tone="info" />
                <app-status-badge
                  [label]="item.ticket.track === 'RD' ? 'R&D' : 'Implement'"
                  [tone]="item.ticket.track === 'RD' ? 'info' : 'primary'"
                />
                <app-status-badge
                  [label]="item.personId ? 'พร้อมจ่ายงาน' : 'ลงสัปดาห์นี้ไม่ได้'"
                  [tone]="item.personId ? 'success' : 'warning'"
                />
                @if (item.personId) {
                  <app-person-avatar [personId]="item.personId" [showName]="true" size="xs" />
                }
              </div>
              <p class="m-0 text-sm text-muted leading-relaxed">{{ item.text }}</p>
            </div>
            @if (item.personId) {
              <div class="flex items-center gap-2">
                <button
                  ejs-button
                  [isPrimary]="true"
                  type="button"
                  [attr.data-ticket]="item.ticket.id"
                  [disabled]="!canAssign() || accepting()"
                  (click)="accept(item)"
                >
                  รับข้อเสนอ
                </button>
                <button
                  ejs-button
                  cssClass="e-outline e-warning"
                  type="button"
                  title="จ่ายงานแทรกพร้อมสั่ง Auto-Shift เลื่อนวันส่งงานเดิมของน้องทันที"
                  [disabled]="!canAssign() || accepting()"
                  (click)="acceptAsMdDirect(item)"
                >
                  ⚡ รับงานด่วน MD &amp; เลื่อนงานเดิม
                </button>
              </div>
            }
          </div>
        </app-section-card>
      }
      @if (hasMoreBacklog()) {
        <div class="flex items-center justify-center p-3">
          <button
            ejs-button
            cssClass="e-outline e-primary"
            type="button"
            (click)="loadMorePlans()"
          >
            แสดงงานค้างรับเพิ่มอีก 30 ใบ (เหลือ {{ backlogPlans().length - planLimit() }} ใบ)
          </button>
        </div>
      }
    </div>
  </app-section-card>
</section>

<app-confirm-dialog
  #writebackConfirm
  dialogId="queueWritebackDialog"
  header="ยืนยันเขียนกลับ OpenProject"
  [message]="writebackMessage()"
  confirmLabel="ยืนยันและรับข้อเสนอ"
  [confirmDisabled]="accepting()"
  width="480px"
  (confirmed)="confirmWriteback()"
  (cancelled)="cancelWriteback()"
></app-confirm-dialog>
