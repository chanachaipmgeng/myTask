<section class="page">
  <app-page-head
    [breadcrumb]="isMine() ? 'ผลงาน & วิเคราะห์ตัวเอง > เช็กเวลา 3 ทางของฉัน' : 'ตรวจรับ & วิเคราะห์ทีม > ตรวจสอบเวลา 3 ทาง (3-Way Time Inspector)'"
    [title]="isMine() ? 'ตรวจสอบเวลา 3 ทางของฉัน (Estimate vs OpenProject vs GitLab)' : 'หน้าจอตรวจสอบความคลาดเคลื่อนของเวลา 3 ทาง (3-Way Time Audit)'"
    description="เปรียบเทียบเวลาจาก 3 แหล่ง: (1) Estimate MD (2) เวลาที่กรอกใน OpenProject (3) ระยะเวลา Commit จริงบน GitLab"
  >
    <div actions class="flex flex-wrap gap-2">
      @if (isMine()) {
        <a ejs-button cssClass="e-outline" iconCss="e-icons e-table-1" routerLink="/quality/tickets">
          อัปเดตเวลาในตารางใบงานของฉัน
        </a>
      }
      <button ejs-button cssClass="e-primary" iconCss="e-icons e-play" (click)="rerunAudit()">
        รันตรวจสอบใหม่
      </button>
    </div>
  </app-page-head>

  <app-filter-chips
    [options]="filterOptions()"
    [value]="filterType()"
    (valueChange)="setFilter($event)"
  ></app-filter-chips>

  <app-section-card
    title="ความแม่นของประมาณการ (Scatter)"
    subtitle="แต่ละจุดคือใบงานที่ปิด · แกนตั้งคืออัตราส่วนสุทธิตามสูตรคะแนน · สีตามกรอบขนาดใบ (XS/S กว้าง, M มาตรฐาน, L/XL แคบ)"
  >
    @if (scatterPoints().length === 0) {
      <app-sf-message content="ยังไม่มีใบที่ปิดพร้อม Estimate สำหรับวาดจุด" severity="Info" />
    } @else {
      <div class="chart-frame m-0">
        <app-sf-chart
          [series]="scatterSeries()"
          [primaryXAxis]="scatterXAxis"
          [primaryYAxis]="scatterYAxis()"
          [options]="scatterOptions"
        />
      </div>
    }
  </app-section-card>

  <app-section-card
    title="ตารางเปรียบเทียบเวลา 3 มิติ (3-Way Time Matching)"
    subtitle="ตรวจจับ Ghost In-Progress, Outlier, และการลืมบันทึกเวลาปิดงาน"
  >
    <button
      actions
      ejs-button
      cssClass="e-outline"
      iconCss="e-icons e-export-excel"
      (click)="timeGrid.exportExcel()"
    >
      ส่งออก Excel
    </button>

    <ng-template #ticketIdTpl let-data>
      <button ejs-button cssClass="e-link e-small font-semibold" type="button" (click)="openTicket(data.ticketId)">
        {{ data.ticketId }}
      </button>
    </ng-template>
    <ng-template #assigneeTpl let-data>
      <app-person-avatar [name]="data.assignee" [showName]="true" size="xs" />
    </ng-template>
    <ng-template #estTpl let-data>
      <span>{{ data.size }} ({{ data.estimateMd }})</span>
    </ng-template>
    <ng-template #actTpl let-data>
      <span [class.text-rose-600]="data.openProjectActualMd === 0" [class.font-bold]="data.openProjectActualMd === 0">
        {{ data.openProjectActualMd }} MD
      </span>
    </ng-template>
    <ng-template #gitTpl let-data>
      <span>{{ data.gitlabSpanMd > 0 ? data.gitlabSpanMd + ' MD (ช่วง commit)' : 'ไม่มี Commit!' }}</span>
    </ng-template>
    <ng-template #ratioTpl let-data>
      <span [class.text-rose-600]="data.ratio > 1.5" [class.font-bold]="data.ratio > 1.5">
        {{ data.ratio }}x
      </span>
    </ng-template>
    <ng-template #anomalyTpl let-data>
      <app-status-badge
        [label]="data.anomalyLabel"
        [value]="data.isAnomaly ? data.anomalyType : 'OK'"
        [toneMap]="anomalyToneMap"
      ></app-status-badge>
    </ng-template>

    <app-sf-grid
      #timeGrid
      [data]="filteredRows()"
      [columns]="gridColumns"
      [cellTemplates]="{
        ticketId: ticketIdTpl,
        assignee: assigneeTpl,
        estimateMd: estTpl,
        openProjectActualMd: actTpl,
        gitlabSpanMd: gitTpl,
        ratio: ratioTpl,
        anomalyLabel: anomalyTpl
      }"
      [options]="gridOptions"
    />
  </app-section-card>
</section>
