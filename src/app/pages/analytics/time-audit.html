<section class="page">
  <app-page-head
    [breadcrumb]="isMine ? 'ผลงาน & วิเคราะห์ตัวเอง > เช็กเวลา 3 ทางของฉัน' : 'ตรวจรับ & วิเคราะห์ทีม > ตรวจสอบเวลา 3 ทาง (3-Way Time Inspector)'"
    [title]="isMine ? 'ตรวจสอบเวลา 3 ทางของฉัน (Estimate vs OpenProject vs GitLab)' : 'หน้าจอตรวจสอบความคลาดเคลื่อนของเวลา 3 ทาง (3-Way Time Audit)'"
    description="เปรียบเทียบเวลาจาก 3 แหล่ง: (1) Estimate MD (2) เวลาที่กรอกใน OpenProject (3) ระยะเวลา Commit จริงบน GitLab"
  >
    <div actions class="flex flex-wrap gap-2">
      @if (isMine) {
        <a ejs-button cssClass="e-outline" iconCss="e-icons e-table-1" routerLink="/me/tickets">
          อัปเดตเวลาในตารางใบงานของฉัน
        </a>
      }
      <button ejs-button cssClass="e-primary" iconCss="e-icons e-play" (click)="rerunAudit()">
        รันตรวจสอบใหม่
      </button>
    </div>
  </app-page-head>

  <app-filter-chips
    [options]="filterOptions()"
    [value]="filterType()"
    (valueChange)="setFilter($event)"
  ></app-filter-chips>

  <app-section-card
    title="ตารางเปรียบเทียบเวลา 3 มิติ (3-Way Time Matching)"
    subtitle="ตรวจจับ Ghost In-Progress, Outlier, และการลืมบันทึกเวลาปิดงาน"
  >
    <button
      actions
      ejs-button
      cssClass="e-outline"
      iconCss="e-icons e-export-excel"
      (click)="exportGrid(timeGrid)"
    >
      ส่งออก Excel
    </button>

    <ejs-grid
      #timeGrid
      [dataSource]="filteredRows()"
      [allowSorting]="true"
      [allowFiltering]="true"
      height="380px"
    >
      <e-columns>
        <e-column field="ticketId" headerText="รหัสใบงาน" width="110" textAlign="Left">
          <ng-template #template let-data>
            <button ejs-button cssClass="e-link e-small font-semibold" type="button" (click)="openTicket(data.ticketId)">
              {{ data.ticketId }}
            </button>
          </ng-template>
        </e-column>
        <e-column field="title" headerText="ชื่องาน" width="170" textAlign="Left"></e-column>
        <e-column field="assignee" headerText="ผู้รับผิดชอบ" width="110" textAlign="Left"></e-column>
        <e-column field="estimateMd" headerText="Est (1)" width="95" textAlign="Right">
          <ng-template #template let-data>
            <span>{{ data.size }} ({{ data.estimateMd }})</span>
          </ng-template>
        </e-column>
        <e-column field="openProjectActualMd" headerText="OP Act (2)" width="95" textAlign="Right">
          <ng-template #template let-data>
            <span [class.text-rose-600]="data.openProjectActualMd === 0" [class.font-bold]="data.openProjectActualMd === 0">
              {{ data.openProjectActualMd }} MD
            </span>
          </ng-template>
        </e-column>
        <e-column field="gitlabSpanMd" headerText="GitLab Commit Span (3)" width="150" textAlign="Right">
          <ng-template #template let-data>
            <span>{{ data.gitlabSpanMd > 0 ? data.gitlabSpanMd + ' MD (ช่วง commit)' : 'ไม่มี Commit!' }}</span>
          </ng-template>
        </e-column>
        <e-column field="ratio" headerText="สัดส่วน" width="85" textAlign="Right">
          <ng-template #template let-data>
            <span [class.text-rose-600]="data.ratio > 1.5" [class.font-bold]="data.ratio > 1.5">
              {{ data.ratio }}x
            </span>
          </ng-template>
        </e-column>
        <e-column field="anomalyLabel" headerText="ความผิดปกติ" width="150">
          <ng-template #template let-data>
            <app-status-badge
              [label]="data.anomalyLabel"
              [value]="data.isAnomaly ? data.anomalyType : 'OK'"
              [toneMap]="anomalyToneMap"
            ></app-status-badge>
          </ng-template>
        </e-column>
      </e-columns>
    </ejs-grid>
  </app-section-card>
</section>
