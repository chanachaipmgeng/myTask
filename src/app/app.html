<div class="app-frame" [class.is-narrow]="narrow()" [class.nav-open]="navOpen()">
  <ejs-sidebar
    id="app-nav"
    type="Over"
    width="248px"
    [isOpen]="navOpen()"
    [showBackdrop]="narrow()"
    [closeOnDocumentClick]="narrow()"
    [enableGestures]="false"
    [animate]="false"
    (close)="onNavClose()"
  >
    <div class="brand">
      <p class="eyebrow">Man-day scorecard</p>
      <p class="brand-title">คะแนนใบงาน</p>
      <p class="brand-sub">1 MD = 6 ชั่วโมงโฟกัส</p>
    </div>
    <nav class="side-nav">
      <a routerLink="/team" routerLinkActive="is-active">แดชบอร์ดทีม</a>
      <a routerLink="/people" routerLinkActive="is-active" [routerLinkActiveOptions]="{ exact: true }">กระดานรายคน</a>
      <a routerLink="/people/itsara" routerLinkActive="is-active">รายคน · อิสรภาพ</a>
      <a routerLink="/tickets" routerLinkActive="is-active">ใบงาน</a>
      <a routerLink="/pipeline" routerLinkActive="is-active">สถานะงาน</a>
      <a routerLink="/queue" routerLinkActive="is-active">คิวงานใหม่</a>
      <a routerLink="/mygit" routerLinkActive="is-active">ซิงก์ mygit</a>
      <a routerLink="/teams" routerLinkActive="is-active">แจ้งเตือน Teams</a>
      <a routerLink="/ai" routerLinkActive="is-active">ติดตามงาน AI</a>
      <a routerLink="/admin" routerLinkActive="is-active">หลังบ้าน</a>
    </nav>
  </ejs-sidebar>

  <div class="workspace">
    <ejs-appbar colorMode="Dark" cssClass="shell-appbar" [isSticky]="true">
      <button ejs-button cssClass="nav-toggle e-flat" iconCss="e-icons e-menu" type="button" (click)="toggleNav()" aria-label="เปิดหรือพับเมนู"></button>
      <span class="appbar-title">{{ title() }}</span>
      <span class="appbar-note">R&amp;D และ Implement</span>
    </ejs-appbar>

    <section class="shell-alerts mx-4 mt-4 grid gap-2 md:mx-6" aria-label="แจ้งเตือน">
      @if (alerts().length === 0) {
        <ejs-message content="ไม่มีใบที่ใกล้หมดสัปดาห์หรือมีแนวโน้มเกิน estimate" severity="Info" variant="Outlined"></ejs-message>
      } @else {
        @for (alert of alerts(); track alert.id) {
          <ejs-message [content]="alert.message" severity="Warning" variant="Outlined"></ejs-message>
        }
      }
    </section>

    <main class="px-4 pb-10 pt-2 md:px-6">
      <router-outlet />
    </main>
  </div>
</div>

<ejs-toast
  #toast
  id="shell-toast"
  [position]="toastPosition"
  [timeOut]="4000"
  [showCloseButton]="true"
  width="320px"
></ejs-toast>
