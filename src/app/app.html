<div class="app-frame" [class.is-narrow]="narrow()" [class.nav-open]="navOpen()">
  <ejs-sidebar
    id="app-nav"
    type="Over"
    width="260px"
    [isOpen]="navOpen()"
    [showBackdrop]="narrow()"
    [closeOnDocumentClick]="narrow()"
    [enableGestures]="false"
    [animate]="false"
    (close)="onNavClose()"
  >
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">MD</div>
      <div>
        <p class="eyebrow">Man-day scorecard</p>
        <p class="brand-title">คะแนนใบงาน</p>
        <p class="brand-sub">1 MD = 6 ชั่วโมงโฟกัส</p>
      </div>
    </div>

    <ejs-treeview
      id="app-nav-tree"
      cssClass="side-nav-tree"
      [fields]="navFields"
      [expandedNodes]="expandedNodes"
      [selectedNodes]="selectedNodes()"
      [fullRowSelect]="true"
      (nodeSelecting)="onNavSelecting($event)"
      (nodeClicked)="onNavClick($event)"
      (nodeSelected)="onNavSelect($event)"
    ></ejs-treeview>
  </ejs-sidebar>

  <div class="workspace">
    <ejs-appbar colorMode="Inherit" cssClass="shell-appbar" [isSticky]="true">
      <button ejs-button cssClass="nav-toggle e-flat e-inherit" iconCss="e-icons e-menu" type="button" (click)="toggleNav()" aria-label="เปิดหรือพับเมนู"></button>
      <div class="appbar-copy">
        <span class="appbar-title">{{ title() }}</span>
        <span class="appbar-note">R&amp;D และ Implement</span>
      </div>
      @if (alerts().length > 0) {
        <span class="e-badge e-badge-warning e-badge-pill appbar-alert-chip">แจ้งเตือน {{ alerts().length }}</span>
      }
    </ejs-appbar>

    <section class="shell-alerts" aria-label="แจ้งเตือน">
      @if (alerts().length === 0) {
        <ejs-message content="ไม่มีใบที่ใกล้หมดสัปดาห์หรือมีแนวโน้มเกิน estimate" severity="Info" variant="Outlined"></ejs-message>
      } @else {
        @for (alert of alerts(); track alert.id) {
          <ejs-message [content]="alert.message" severity="Warning" variant="Outlined"></ejs-message>
        }
      }
    </section>

    <main class="shell-main">
      <router-outlet />
    </main>
  </div>
</div>

<ejs-toast
  #toast
  id="shell-toast"
  [position]="toastPosition"
  [timeOut]="4000"
  [showCloseButton]="true"
  width="320px"
></ejs-toast>
