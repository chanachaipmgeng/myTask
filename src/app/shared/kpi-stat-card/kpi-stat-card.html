<div class="e-card kpi-stat" [attr.data-accent]="accent">
  <div class="e-card-header kpi-stat__header">
    <div class="e-card-header-caption">
      <div class="e-card-header-title kpi-stat__title">{{ title }}</div>
    </div>
    @if (badge) {
      <span [class]="badgeClass()">{{ badge }}</span>
    } @else if (iconCss) {
      <span class="kpi-stat__icon e-icons {{ iconCss }}" aria-hidden="true"></span>
    }
  </div>
  <div class="e-card-content kpi-stat__body">
    <p class="kpi-value kpi-stat__value">{{ value }}</p>
    @if (progress !== null && progress !== undefined) {
      <ejs-progressbar
        type="Linear"
        [theme]="theme.sfTheme()"
        width="100%"
        height="12"
        [minimum]="0"
        [maximum]="100"
        [value]="progress"
        [trackThickness]="8"
        [progressThickness]="8"
        [progressColor]="fillColor()"
        [trackColor]="theme.progressTrack()"
      ></ejs-progressbar>
    }
    @if (hint) {
      <p class="kpi-stat__hint">{{ hint }}</p>
    }
  </div>
</div>
