<app-sf-dialog
  #dialog
  [id]="dialogId"
  [header]="header"
  [width]="width"
  cssClass="app-modal-confirm"
  (closed)="onDialogClose()"
>
  <p class="confirm-dialog__message">{{ message }}</p>
  <ng-content></ng-content>
  <div sf-dialog-footer class="confirm-dialog__footer flex justify-end gap-2">
    @if (showCancel) {
      <button ejs-button [cssClass]="'e-outline'" [content]="cancelLabel" type="button" (click)="onCancel()"></button>
    }
    <button
      ejs-button
      [cssClass]="confirmCssClass"
      [content]="confirmLabel"
      [disabled]="confirmDisabled"
      type="button"
      (click)="onConfirm()"
    ></button>
  </div>
</app-sf-dialog>
