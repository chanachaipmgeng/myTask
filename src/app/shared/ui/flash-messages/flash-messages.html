@if (success || error || info || warning) {
  <div class="app-flash">
    @if (success) {
      <app-sf-message severity="Success" [content]="success" />
    }
    @if (error) {
      <app-sf-message severity="Error" [content]="error" />
    }
    @if (info) {
      <app-sf-message severity="Info" [content]="info" />
    }
    @if (warning) {
      <app-sf-message severity="Warning" [content]="warning" />
    }
  </div>
}
