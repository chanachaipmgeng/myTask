@if (success || error || info || warning) {
  <div class="app-flash">
    @if (success) {
      <ejs-message severity="Success" [content]="success"></ejs-message>
    }
    @if (error) {
      <ejs-message severity="Error" [content]="error"></ejs-message>
    }
    @if (info) {
      <ejs-message severity="Info" [content]="info"></ejs-message>
    }
    @if (warning) {
      <ejs-message severity="Warning" [content]="warning"></ejs-message>
    }
  </div>
}
