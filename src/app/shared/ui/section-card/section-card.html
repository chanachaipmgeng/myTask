<app-motion-wrapper
  [config]="resolvedMotion"
  [refreshKey]="refreshKey"
  [glowTone]="glowTone"
  [loading]="loading"
>
  <div class="e-card section-card" [attr.data-variant]="variant">
    @if (hasHead) {
      <div class="e-card-header section-card-head">
        <div class="e-card-header-caption section-card-copy">
          @if (title) {
            <div class="e-card-header-title">{{ title }}</div>
          }
          @if (subtitle) {
            <p class="fine section-card-subtitle">{{ subtitle }}</p>
          }
        </div>
        <div class="section-card__actions">
          @if (badge) {
            <app-status-badge [label]="badge" [tone]="badgeTone"></app-status-badge>
          }
          <ng-content select="[actions]"></ng-content>
        </div>
      </div>
    }
    <div class="e-card-content section-card-body">
      <ng-content></ng-content>
    </div>
  </div>
</app-motion-wrapper>
