<div #track class="app-filter-chips" role="group">
  <span
    class="chip-pill-indicator"
    aria-hidden="true"
    [class.is-visible]="pill().visible"
    [class.is-animated]="pill().ready"
    [style.transform]="'translate3d(' + pill().x + 'px, ' + pill().y + 'px, 0)'"
    [style.width.px]="pill().width"
    [style.height.px]="pill().height"
  ></span>
  @for (opt of options; track opt.id) {
    <button
      type="button"
      class="chip-pill-btn"
      [class.is-active]="value === opt.id"
      [attr.aria-pressed]="value === opt.id"
      (click)="select(opt.id)"
    >
      <span>{{ opt.label }}</span>
      @if (opt.count != null) {
        <span class="chip-pill-count tabular-nums">{{ opt.count }}</span>
      }
    </button>
  }
</div>
