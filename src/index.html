<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <title>myTask</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link id="sf-theme-link" rel="stylesheet" href="assets/themes/tailwind3.css?v=2.3.0" data-beasties-skip>
  <script>
    (function() {
      try {
        var params = new URLSearchParams(window.location.search);
        var qTheme = params.get('theme');
        var isDark = (qTheme === 'light' || qTheme === 'dark' ? qTheme : localStorage.getItem('md-theme')) === 'dark';
        var link = document.getElementById('sf-theme-link');
        if (link) link.href = (isDark ? 'assets/themes/tailwind3-dark.css' : 'assets/themes/tailwind3.css') + '?v=2.3.0';
        document.documentElement.classList.toggle('e-dark-mode', isDark);
        document.documentElement.classList.toggle('e-light-mode', !isDark);
      } catch (e) {}
    })();
  </script>
</head>
<body class="e-light-mode">
  <script>if(document.documentElement.classList.contains('e-dark-mode')){document.body.classList.replace('e-light-mode','e-dark-mode');}</script>
  <app-root></app-root>
</body>
</html>
