<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <title>Man-day Scorecard</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link id="sf-theme-link" rel="stylesheet" href="assets/themes/tailwind3-dark.css" data-beasties-skip>
  <script>
    (function() {
      try {
        var theme = localStorage.getItem('md-theme');
        if (theme === 'light') {
          var link = document.getElementById('sf-theme-link');
          if (link) link.href = 'assets/themes/tailwind3.css';
        }
      } catch (e) {}
    })();
  </script>
</head>
<body class="e-dark-mode">
  <script>
    (function() {
      try {
        var theme = localStorage.getItem('md-theme');
        if (theme === 'light') {
          document.body.classList.remove('e-dark-mode');
          document.body.classList.add('e-light-mode');
        }
      } catch (e) {}
    })();
  </script>
  <app-root></app-root>
</body>
</html>
