x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:16-alpine
    container_name: manday-db
    logging: *default-logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-manday}
      POSTGRES_USER: ${POSTGRES_USER:-manday}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-manday}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - manday-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-manday} -d ${POSTGRES_DB:-manday}"]
      interval: 3s
      timeout: 3s
      retries: 20
    networks:
      - manday-net
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: docker/Dockerfile.api
    container_name: manday-api
    logging: *default-logging
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-manday}:${POSTGRES_PASSWORD:-manday}@db:5432/${POSTGRES_DB:-manday}
      DB_POOL_MAX: ${DB_POOL_MAX:-20}
      DATABASE_SSL: ${DATABASE_SSL:-false}
      HOST: 0.0.0.0
      PORT: 3000
      APP_URL: ${APP_URL:-http://localhost:8080}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      ALLOWED_INTEGRATION_HOSTS: ${ALLOWED_INTEGRATION_HOSTS:-}
      # Dev stack ค่าเริ่มเปิด Dev Login — production ต้องตั้ง AUTH_DEV_LOGIN=false และ NODE_ENV=production
      NODE_ENV: ${NODE_ENV:-development}
      AUTH_DEV_LOGIN: ${AUTH_DEV_LOGIN:-true}
      DISABLE_AUTO_SEED: ${DISABLE_AUTO_SEED:-false}
      TOKEN_ENC_KEY: ${TOKEN_ENC_KEY:-dev-only-insecure-key-change-me-please}
      TOKEN_ENC_KEY_PREV: ${TOKEN_ENC_KEY_PREV:-}
      SESSION_DAYS: ${SESSION_DAYS:-7}
      OPENPROJECT_URL: ${OPENPROJECT_URL:-}
      OPENPROJECT_API_TOKEN: ${OPENPROJECT_API_TOKEN:-}
      OPENPROJECT_WRITEBACK: ${OPENPROJECT_WRITEBACK:-false}
      OPENPROJECT_SYNC_CRON: ${OPENPROJECT_SYNC_CRON:-*/15 * * * *}
      OPENPROJECT_TEAM_STAGING: ${OPENPROJECT_TEAM_STAGING:-all}
      GITLAB_URL: ${GITLAB_URL:-}
      GITLAB_OAUTH_CLIENT_ID: ${GITLAB_OAUTH_CLIENT_ID:-}
      GITLAB_OAUTH_CLIENT_SECRET: ${GITLAB_OAUTH_CLIENT_SECRET:-}
      GITLAB_WEBHOOK_SECRET: ${GITLAB_WEBHOOK_SECRET:-}
      BOOTSTRAP_ADMIN_GITLAB_USERNAMES: ${BOOTSTRAP_ADMIN_GITLAB_USERNAMES:-}
      GITLAB_API_TOKEN: ${GITLAB_API_TOKEN:-}
      GITLAB_PROJECT_IDS: ${GITLAB_PROJECT_IDS:-}
      TEAMS_WEBHOOK_URL: ${TEAMS_WEBHOOK_URL:-}
      TEAMS_DEFAULT_CHANNEL: ${TEAMS_DEFAULT_CHANNEL:-scorecard-alerts}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "${API_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/api/health').then(r=>r.ok?process.exit(0):process.exit(1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - manday-net
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
      args:
        SYNCFUSION_LICENSE: ${SYNCFUSION_LICENSE:-}
    container_name: manday-web
    logging: *default-logging
    depends_on:
      api:
        condition: service_started
    ports:
      - "${WEB_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 3
    networks:
      - manday-net
    restart: unless-stopped

  adminer:
    image: adminer:latest
    container_name: manday-adminer
    logging: *default-logging
    depends_on:
      - db
    ports:
      - "${ADMINER_PORT:-8088}:8080"
    environment:
      ADMINER_DEFAULT_SERVER: db
    networks:
      - manday-net
    restart: unless-stopped

  db-backup:
    image: prodrigestivill/postgres-backup-local:16-alpine
    container_name: manday-db-backup
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_DB: ${POSTGRES_DB:-manday}
      POSTGRES_USER: ${POSTGRES_USER:-manday}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-manday}
      SCHEDULE: "@daily"
      BACKUP_KEEP_DAYS: 7
      BACKUP_KEEP_WEEKS: 4
      BACKUP_KEEP_MONTHS: 6
      HEALTHCHECK_PORT: 80
    volumes:
      - ./backups:/backups
    networks:
      - manday-net
    restart: unless-stopped
    profiles:
      - backup

networks:
  manday-net:
    name: manday-net
    driver: bridge

volumes:
  manday-db:
    name: manday-db

